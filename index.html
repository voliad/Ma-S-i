:root{--bg:#171b1a;--panel:#1e2321;--raised:#252b27;--line:#343b34;--muted:#b1b8aa;--text:#e9e7dc;--gold:#c2af7d;--gold2:#e0c993;--red:#b5786d;--green:#9aab8c;--sans:"Dem Lang Sans",system-ui,sans-serif;--serif:"Dem Lang Serif",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.35}
button{transition:background .18s,border-color .18s,transform .18s}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
a{color:inherit;text-decoration:none}
.topbar{height:94px;max-width:1360px;margin:auto;padding:0 44px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;font-family:var(--serif);font-weight:bold;font-size:22px;letter-spacing:2px;line-height:1.1}
.brand small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:3.8px;color:var(--muted);margin-top:8px}
.brand-mark{display:block;width:40px;height:46px;color:var(--gold)}
svg{width:100%;height:100%}
nav{height:100%;display:flex;gap:37px}
.nav{position:relative;border:0;background:none;color:var(--muted);padding:0 2px;font-size:16px}
.nav.active{color:var(--gold2)}
.nav.active:after{content:'';height:2px;background:var(--gold);position:absolute;bottom:-1px;left:0;right:0}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:20px;color:var(--muted)}
main{max-width:1260px;margin:auto;padding:0 30px;min-height:calc(100vh - 181px)}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;min-height:290px;position:relative;overflow:hidden}
.eyebrow{font-size:13px;letter-spacing:2.8px;color:var(--gold);font-weight:bold;text-transform:uppercase}
.hero h1{font-family:var(--serif);font-size:68px;line-height:1.25;font-weight:normal;letter-spacing:0;margin:16px 0 17px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--muted);max-width:420px;margin:0;font-size:16px;line-height:1.8}
.hero-art{height:278px;width:100%;position:relative;opacity:.9;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 90%,transparent)}
.hero-tags{display:flex;gap:23px;margin-top:20px;font-size:13px;letter-spacing:.4px;color:#b5b9ac}
.hero-tags span:first-child{color:var(--gold)}
.workspace-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}
.workspace-head h2{font-family:var(--serif);font-weight:normal;font-size:25px;margin:0}
.workspace-head p{color:var(--muted);font-size:14px;margin:4px 0 0}
.steps{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.steps span{display:flex;align-items:center;gap:8px}
.steps b{border:1px solid var(--line);border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-weight:normal;font-size:13px}
.steps .active{color:var(--gold)}
.steps .active b{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.setup-grid{display:grid;grid-template-columns:minmax(260px, .94fr) minmax(340px,1.35fr) minmax(235px,.81fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-head{padding:20px 21px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-title{display:flex;align-items:center;gap:10px}
.panel-title h3{font-size:16px;font-weight:600;margin:0}
.panel-title .symbol{color:var(--gold);font-size:19px}
.count-badge{color:var(--muted);font-size:13px;background:#2b312b;border-radius:4px;padding:3px 7px}
.subtle{color:var(--muted);font-size:14px}
.panel-body{padding:0 20px 20px}
.players-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.player-input{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:5px;min-width:0;height:38px}
.player-input span{font-size:12px;color:var(--gold);width:27px;text-align:center;flex-shrink:0}
.player-input input{background:transparent;border:0;color:var(--text);width:100%;min-width:0;padding:8px 0;font-size:14px;outline:none}
.player-input:focus-within{border-color:var(--gold)}
.player-input button{border:0;background:transparent;color:var(--muted);padding:5px 8px 5px 3px;font-size:16px}
.add-btn{width:100%;border:1px dashed #535847;background:transparent;border-radius:5px;color:var(--gold);padding:10px;margin:13px 0 0;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:13px 0 0;line-height:1.7}
.hint .gold{color:var(--gold)}
.panel-rule{border:0;border-top:1px solid var(--line);margin:18px 0}
.segmented{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px;gap:4px}
.segmented button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 6px;border-radius:3px;font-size:13px}
.segmented button.selected{background:#383d30;color:var(--gold2)}
.role-list{margin-top:10px}
.role-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #30362e}
.role-row:last-child{border-bottom:0}
.role-symbol{width:38px;height:40px;padding:9px;border-radius:7px;background:#30352b;color:var(--gold);flex-shrink:0}
.role-row.wolf .role-symbol{background:#392b28;color:#c08d7b}
.role-info{flex:1}
.role-info b{font-weight:500;font-size:15px}
.role-info p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:25px;height:25px;border:1px solid #404639;border-radius:4px;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.stepper span{width:12px;text-align:center;font-size:15px}
.text-btn{padding:0;border:0;background:none;color:var(--gold);font-size:14px}
.more-roles{padding-top:13px;display:flex;justify-content:space-between}
.summary{padding:23px 20px;background:linear-gradient(145deg,#2a2f25,#20251f)}
.summary-label{font-size:12px;letter-spacing:2px;color:var(--gold)}
.summary-number{font-family:var(--serif);font-size:49px;line-height:1;margin:21px 0 6px}
.summary-number small{font-family:var(--sans);font-size:14px;color:var(--muted);margin-left:7px}
.balance{height:5px;display:flex;gap:4px;margin:22px 0 12px}
.balance span{border-radius:4px;height:100%}
.balance-key{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.balance-key b{color:var(--text);font-weight:normal}
.summary-rule{border:0;border-top:1px solid #424735;margin:23px 0 17px}
.setting-line{display:flex;justify-content:space-between;margin:11px 0;font-size:14px;color:var(--muted)}
.setting-line b{color:var(--text);font-weight:normal}
.primary{background:var(--gold);border:1px solid var(--gold);border-radius:5px;color:#20251e;padding:13px 18px;font-size:15px;font-weight:bold}
.start{width:100%;margin-top:17px;display:flex;justify-content:space-between}
.summary .hint{text-align:center;font-size:12px}
.error{color:#e2a391;font-size:14px}
.intro-note{padding:16px 2px 26px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.intro-note span:first-child:before{content:'◇';color:var(--gold);margin-right:8px}
footer{max-width:1270px;margin:20px auto 0;border-top:1px solid var(--line);padding:22px 20px 24px;display:flex;align-items:center;justify-content:space-between;color:#858d81;font-size:12px;letter-spacing:.3px}
footer i{color:var(--gold);margin:0 9px}
footer button{background:transparent;border:0;color:var(--muted);font-size:13px}
.dot{display:inline-block;background:var(--green);width:5px;height:5px;border-radius:50%;margin-right:5px}
dialog{color:var(--text);background:var(--panel);border:1px solid #4e5545;border-radius:12px;max-width:530px;width:calc(100% - 32px);padding:28px}
dialog::backdrop{background:#090c0bce;backdrop-filter:blur(7px)}
.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
.dialog-head h2{font-family:var(--serif);font-size:25px;font-weight:normal;margin:0}
.close{background:none;border:0;color:var(--muted);font-size:24px}
.field{display:block;margin-bottom:19px}
.field>span{display:block;margin-bottom:8px;font-size:15px}
.field select,.field input[type=number],textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:5px;outline:none}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.check{display:flex;gap:10px;align-items:start;margin:17px 0;font-size:15px}
.check input{accent-color:var(--gold);margin-top:5px}
.check small{display:block;color:var(--muted);font-size:13px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--bg);padding:12px 22px;border-radius:5px;font-size:15px;opacity:0;pointer-events:none;z-index:9;transition:opacity .2s}
#toast.visible{opacity:1}
.page-heading{padding:54px 0 26px}
.page-heading h1{font-family:var(--serif);font-weight:normal;font-size:45px;margin:8px 0}
.page-heading p{color:var(--muted);max-width:650px}
.library{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:30px}
.role-card{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.role-card .role-symbol{width:54px;height:60px;padding:13px;margin-bottom:22px}
.role-card h2{font-family:var(--serif);font-size:24px;font-weight:normal;margin:6px 0}
.role-card p{font-size:15px;color:var(--muted);line-height:1.8}
.faction{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold)}
.rules-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:25px;padding-bottom:40px}
.rules-grid article{padding:24px;border:1px solid var(--line);background:var(--panel);border-radius:8px}
.rules-grid h2{font-family:var(--serif);font-weight:normal;font-size:24px;margin-top:0}
.rules-grid li{margin:13px 0;padding-left:5px;color:var(--muted);font-size:16px}
.rules-grid strong{color:var(--text)}
.game-wrap{max-width:800px;margin:0 auto;padding:35px 0 50px}
.game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.game-top p{font-size:13px;letter-spacing:1.3px;color:var(--gold);margin:0}
.game-stage{padding:35px;background:var(--panel);border:1px solid var(--line);border-radius:13px;text-align:center}
.game-stage h1{font-family:var(--serif);font-size:38px;font-weight:normal;margin:12px 0}
.game-stage p{color:var(--muted);font-size:16px;max-width:510px;margin:14px auto 23px;line-height:1.9}
.game-stage .large-symbol{width:80px;height:90px;display:block;color:var(--gold);margin:20px auto}
.role-reveal{border:1px solid #5e6145;border-radius:10px;margin:24px auto;padding:25px;max-width:350px;background:radial-gradient(ellipse at top,#384130,transparent 80%)}
.role-reveal h2{font-family:var(--serif);font-size:36px;font-weight:normal;margin:12px 0}
.secondary{background:transparent;color:var(--text);border:1px solid #4a5143;border-radius:5px;padding:12px 18px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:25px}
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:23px 0}
.target{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px 9px;text-align:left;display:flex;gap:10px;align-items:center;font-size:15px;overflow:hidden}
.target span{overflow-wrap:anywhere}
.avatar{width:25px;height:25px;border-radius:50%;background:#32392d;color:var(--gold);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.target.chosen{border-color:var(--gold);background:#363b2c}
.target.dead{opacity:.55}
.target small{display:block;color:var(--muted);font-size:13px}
.progress{height:3px;background:var(--line);margin-top:27px;border-radius:4px}
.progress>div{height:100%;background:var(--gold);border-radius:4px}
.timer{font-size:76px;font-family:var(--serif);color:var(--gold);line-height:1.3;font-variant-numeric:tabular-nums}
.alive-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.alive-strip span{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:5px 12px}
.vote-row{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.vote-row .name{flex:1}
.vote-row .stepper{gap:20px}
.vote-row .stepper button{width:33px;height:33px}
.results-list{text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results-list>div{padding:12px 14px;background:var(--bg);border-radius:5px;display:flex;align-items:center;gap:12px}
.results-list b{font-weight:normal;font-size:15px}
.results-list small{display:block;color:var(--muted);font-size:13px}
.log{text-align:left;margin-top:25px;border-top:1px solid var(--line);padding-top:20px}
.log li{font-size:15px;color:var(--muted);padding:5px}
.resume{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#30372a;border:1px solid #596144;border-radius:7px;margin:15px 0 20px;gap:15px}
.resume p{font-size:15px;margin:0;color:var(--text)}
.resume small{font-size:13px;color:var(--muted)}
.mode-label{font-size:13px;color:var(--muted);margin:15px 0 7px}
.reduced{font-size:14px;color:var(--muted)}
details{margin:20px 0;text-align:left}
summary{cursor:pointer;color:var(--gold);font-size:15px}
.empty{font-size:16px;padding:30px;color:var(--muted)}

àn bộ người đã dính xăng. Không chết bởi đòn cắn thường của Sói. Thắng khi sống cuối cùng.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_assassin","en":"Assassin","name":"Hội sát thủ","group":"solo","phase":"both","desc":"Vai dành cho thể thức riêng: các Sát thủ thảo luận và bỏ phiếu giết một người mỗi ngày; có cơ chế đoán vai và trao vương miện chống phiếu. Phải thống nhất thể thức trước ván.","auto":false,"random":false,"experimental":false,"houseRule":true,"maxCount":1},{"key":"ext_astronomer","en":"Astronomer","name":"Nhà thiên văn","group":"village","phase":"night","desc":"Một lần tạo trăng non ngăn Sói giết trong đêm; một lần gọi sao băng giết người. Nếu sao băng trúng người Làng, cả mục tiêu và Nhà thiên văn chết.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"aura","en":"Aura Seer","name":null,"group":"village","phase":"night","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"hunter","en":"Avenger","name":null,"group":"village","phase":"night","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_baker","en":"Baker","name":"Thợ làm bánh","group":"village","phase":"night","desc":"Mỗi đêm gửi bánh cho một người. Ngày kế tiếp, người nhận bánh có thêm một phiếu; quản trò chỉnh trọng số phiếu cho đúng chu kỳ.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_bandit","en":"Bandit","name":"Kẻ cướp","group":"solo","phase":"night","desc":"Khi chưa có Đồng phạm, tìm người Làng hoặc phe bỏ phiếu để chuyển thành Đồng phạm; nhắm Sói sẽ giết Sói. Khi đã có Đồng phạm, cùng chọn nạn nhân. Thắng theo phe Kẻ cướp.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_beast_hunter","en":"Beast Hunter","name":"Thợ bẫy thú","group":"village","phase":"night","desc":"Đặt bẫy lên một người; bẫy có hiệu lực từ đêm sau. Chặn đòn đêm; nếu Sói kích bẫy, một Sói yếu nhất chết. Quản trò thống nhất thứ tự sức mạnh của Sói trước ván.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_bell_ringer","en":"Bell-Ringer","name":"Người rung chuông","group":"village","phase":"night","desc":"Chọn một cặp và có thể đổi khi cả hai còn sống. Khi một người trong cặp chết, biết vai thật của người còn lại.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_blight","en":"Blight","name":"Kẻ gieo dịch","group":"solo","phase":"both","desc":"Lây bệnh một người mỗi đêm; vai điều tra kiểm tra người nhiễm có thể bị lây. Đánh dấu người nhiễm để giết vào đầu thảo luận, hoặc giết ngay nếu đã sang ban ngày.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_blind_werewolf","en":"Blind Werewolf","name":"Sói mù","group":"wolf","phase":"night","desc":"Kiểm tra nhóm vai của hai người mỗi đêm; kiểm tra lại một người sẽ biết hào quang. Không tham gia phiếu cắn cho đến khi từ bỏ điều tra, hoặc là Sói cuối cùng.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"bodyguard","en":"Bodyguard","name":null,"group":"village","phase":"night","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_bomber","en":"Bomber","name":"Kẻ đặt bom","group":"solo","phase":"night","desc":"Đặt bom trên tối đa ba vị trí theo sơ đồ bàn đã thống nhất. Bom nổ đêm sau; sau đêm nổ mới đặt bom tiếp. Bom không giết chính người đặt. Cần quản trò theo dõi vị trí.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_bully","en":"Bully","name":"Kẻ bắt nạt","group":"village","phase":"day","desc":"Ném đá gây choáng trong chu kỳ hiện tại và tiếp theo. Ném vào người đã bị choáng sẽ giết họ và lộ vai; tối đa giết hai người bằng cách này.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_butcher","en":"Butcher","name":"Đồ tể","group":"village","phase":"night","desc":"Có sáu phần thịt để bảo vệ người khác vào ban đêm, có thể chia cho nhiều người. Mỗi phần đã cấp đều tiêu hao dù có bị tấn công hay không.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_candy_wolf","en":"Candy Wolf","name":"Sói kẹo","group":"wolf","phase":"night","desc":"Từ sau đêm đầu, có hai lần gửi kẹo độc. Người nhận được cảnh báo; nếu không được bảo vệ trước hết đêm kế tiếp sẽ chết. Không nhắm Sát nhân độc lập.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_cannibal","en":"Cannibal","name":"Kẻ ăn thịt người","group":"solo","phase":"night","desc":"Mỗi đêm tích một điểm đói, tối đa năm. Có thể tiêu điểm để ăn số người tương ứng cùng đêm, hoặc nhịn để tích thêm. Không chết bởi đòn cắn thường của Sói.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_confusion_wolf","en":"Confusion Wolf","name":"Sói hỗn loạn","group":"wolf","phase":"night","desc":"Hai lần trong ván che vai của tất cả người chết đêm đó với làng. Chỉ bầy Sói được biết các vai bị che.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_conjuror","en":"Conjuror","name":"Thuật sĩ gọi hồn","group":"village","phase":"both","desc":"Ban ngày chọn một người Làng đã chết để mượn vai khi bắt đầu bỏ phiếu; trở lại vai gốc ở lượt bỏ phiếu kế tiếp. Khi ở vai gốc có thể trao đổi kín với người chết vào ban đêm.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_corruptor","en":"Corruptor","name":"Kẻ phá hoại","group":"solo","phase":"night","desc":"Chọn người bị nhiễu: ngày sau không nói, bỏ phiếu hay dùng kỹ năng, rồi chết sau bỏ phiếu và bị che vai. Không chết bởi đòn cắn thường của Sói.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_cowardly_lion","en":"Cowardly Lion","name":"Sư tử nhút nhát","group":"village","phase":"day","desc":"Mỗi lượt bỏ phiếu không tham gia sẽ tích một dũng khí. Sau khi chết, dùng toàn bộ dũng khí làm số phiếu chống một người; cần ít nhất hai người Làng còn sống.","auto":false,"random":false,"experimental":true,"houseRule":false,"maxCount":1},{"key":"cupid","en":"Cupid","name":null,"group":"village","phase":"setup","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"cursed","en":"Cursed","name":null,"group":"village","phase":"passive","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_custom_random_role","en":"Custom Random Role","name":"Ngẫu nhiên tùy chọn","group":"random","phase":"setup","desc":"Đây là một ô chia vai ngẫu nhiên, không phải nhân vật riêng. Máy rút vai cụ thể trước khi chia và không lặp vai duy nhất. Nhóm tùy chọn cần có danh sách rút do người chơi chọn.","auto":false,"random":true,"experimental":false,"houseRule":false,"maxCount":24},{"key":"ext_deep_sea_terror","en":"Deep Sea Terror","name":"Ác mộng biển sâu","group":"solo","phase":"night","desc":"Mỗi đêm đánh dấu một người, người có dấu không bỏ phiếu. Từ đêm 2 có thể giết toàn bộ người mang dấu thay vì đặt dấu mới. Người mang dấu chết do nguồn khác giúp có thêm lượt đặt dấu.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"detective","en":"Detective","name":null,"group":"village","phase":"night","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"guard","en":"Doctor","name":null,"group":"village","phase":"night","desc":null,"auto":true,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_doppelganger","en":"Doppelganger","name":"Kẻ song trùng","group":"village","phase":"setup","desc":"Đêm đầu chọn một người. Khi người đó chết, nhận vai và điều kiện thắng của họ; quản trò đổi vai trước khi tiếp tục lượt kỹ năng.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_dorothy","en":"Dorothy","name":"Dorothy","group":"village","phase":"night","desc":"Thăm người có kỹ năng điều tra, bảo vệ hoặc giết để thu trí tuệ, trái tim và dũng khí. Đủ ba loại thì có một lần tạt nước giết kẻ ác; khi đi thăm chỉ chết nếu người được thăm chết.","auto":false,"random":false,"experimental":true,"houseRule":false,"maxCount":1},{"key":"ext_drunk","en":"Drunk","name":"Người say","group":"village","phase":"passive","desc":"Thuộc Làng, không được nói vào ban ngày nhưng vẫn được bỏ phiếu. Quản trò nhắc giới hạn giao tiếp trước khi chơi.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_easter_bunny","en":"Easter Bunny","name":"Thỏ Phục sinh","group":"village","phase":"both","desc":"Nhận bốn trứng theo thứ tự ngẫu nhiên. Ban ngày chọn người để thăm đêm: vàng bảo vệ, trắng cấm nói cả hai, xanh khóa kỹ năng mục tiêu, đỏ xem hào quang. Người thăm chết nếu mục tiêu chết.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_evil_cupid","en":"Evil Cupid","name":"Cupid tà ác","group":"solo","phase":"night","desc":"Chọn một người để giết hoặc hai người để ràng buộc cái chết. Người bị liên kết không biết nhau; mỗi người chỉ bị liên kết một lần. Không chết bởi đòn cắn thường của Sói.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_evil_detective","en":"Evil Detective","name":"Thám tử tà ác","group":"solo","phase":"night","desc":"Mỗi đêm so sánh hai người. Khác phe thì cả hai chết; cùng phe thì không chết và được biết phe. Có thể chọn mình để chỉ giết người còn lại. Thắng khi sống cuối cùng.","auto":false,"random":false,"experimental":false,"houseRule":false,"maxCount":1},{"key":"ext_evil_santa","en":"Evil Santa","name":"Ông già Noel tà ác","group":"solo","phase":"both","desc":"Ban ngày chọn hai người trao quà đêm sau. Mỗi ngư  wolf:{name:'Ma sói',team:'Phe Sói',short:'Cùng bầy chọn một nạn nhân mỗi đêm.',desc:'Thức cùng mọi vai thuộc phe Sói và thống nhất một nạn nhân mỗi đêm. Sói thắng khi đạt cân bằng quân số và không còn Sát nhân hay đôi tình nhân khác phe đang sống.'},

 witch:{name:'Phù thủy',team:'Phe Làng',short:'Một bình cứu và một bình độc cho cả ván.',desc:'Biết mục tiêu Sói. Có một bình cứu đòn Sói và một bình độc, được tự cứu và dùng cả hai cùng đêm. Bình cứu không ngăn Sát nhân; độc bỏ qua bảo vệ và sức bền.'},

 detective:{name:'Thám tử',team:'Phe Làng',short:'So sánh phe của hai người mỗi đêm.',desc:'Chọn hai người khác nhau mỗi đêm, được chọn mình. Biết hai người cùng phe hay khác phe, không biết vai cụ thể. Tình nhân không thay đổi kết quả so sánh; người bị phù phép được đọc như phe Sói trong đêm đó. Chán đời và Sát nhân là hai phe riêng.'},
 bodyguard:{name:'Vệ sĩ',team:'Phe Làng',short:'Đỡ đòn thay mục tiêu, chịu được một đòn.',desc:'Mỗi đêm chọn một người, có thể chọn mình và lặp lại mục tiêu. Đòn Sói hoặc Sát nhân vào mục tiêu được chuyển sang Vệ sĩ. Vệ sĩ chịu được đòn đầu trong cả ván; đòn thứ hai sẽ chết, kể cả hai đòn trong cùng đêm. Độc, súng và tên bỏ qua sức bền. Bảo vệ chặn đòn trước khi Vệ sĩ đỡ.'},

function setupSuggestions(){const n=state.players.length,experience=state.experience||'new',recommended=recommendedPreset(experience,n);let ids=experience==='expert'?['inheritance','advanced','expanded']:experience==='regular'?['special','classic','miller']:['intro','miller','classic'];ids=[...new Set([recommended,...ids])].filter(id=>presetAvailable(id,n));return `<details id="setupSuggestions" class="setup-suggestions" ${suggestionsOpen?'open':''}><summary><span><b>Chưa biết chọn vai? Xem bộ gợi ý</b><small>${n} người · gợi ý ${SETUP_PROFILES[recommended].name}</small></span><span class="details-arrow" aria-hidden="true">⌄</span></summary><div class="suggestions-content"><div class="suggestions-head"><div><div class="eyebrow">Chọn nhanh · V7</div><h2 id="suggestionsTitle">Chưa biết xếp vai? Chọn một bộ cho ${n} người.</h2><p>Chỉ tính người nhận vai, không tính quản trò. Bộ tự cập nhật khi đổi số người.</p></div><label class="experience-field"><span>Nhóm của bạn</span><select id="groupExperience"><option value="new" ${experience==='new'?'selected':''}>Mới chơi / có người mới</option><option value="regular" ${experience==='regular'?'selected':''}>Đã chơi vài ván</option><option value="expert" ${experience==='expert'?'selected':''}>Chơi lâu năm, thích đấu trí</option></select></label></div><div class="suggestion-cards">${ids.map(id=>{const p=SETUP_PROFILES[id],r=presetDeck(id,n),active=state.preset===id;return `<article class="suggestion-card ${active?'active':''}"><div class="suggestion-tags"><span>${id===recommended?'Đề xuất cho nhóm':''}</span><small>${p.level} · ${p.minutes} phút/ngày</small></div><h3>${p.name}</h3><p class="suggestion-origin">${p.origin}</p><p>${p.why}</p><div class="preset-composition">${Object.entries(r).filter(([,v])=>v>0).map(([k,v])=>`<span>${ROLES[k].name} <b>×${v}</b></span>`).join('')}</div><p class="suggestion-tip">${p.tip}</p><button class="${active?'secondary':'primary'}" data-action="preset" data-value="${id}" aria-label="Dùng bộ ${p.name}">${active?'Đang dùng bộ này':'Dùng bộ này'} · ${n} vai</button></article>`}).join('')}</div><p class="suggestions-note">Các bộ phối đã điều chỉnh theo luật của trang, không bảo đảm cân bằng với mọi nhóm. Có thể đổi từng vai sau khi áp dụng.</p></div></details>`}
function presetSelector(){return `<div class="preset-selector"><span><label for="presetSelect">Bộ vai hiện tại</label> <button class="text-btn undo-setup" data-action="undo-setup" ${setupUndo?'':'disabled'} type="button">↶ Hoàn tác chỉnh vai</button></span><select id="presetSelect" aria-label="Bộ vai hiện tại"><option value="custom" ${state.preset==='custom'?'selected':''}>Tự chọn từng vai</option>${Object.entries(SETUP_PROFILES).map(([id,p])=>`<option value="${id}" ${state.preset===id?'selected':''} ${presetAvailable(id,state.players.length)?'':'disabled'}>${p.name}${presetAvailable(id,state.players.length)?'':' · '+p.min+'–'+p.max+' người'}</option>`).join('')}</select></div>`}
function roleSlots(){const n=state.players.length,t=totalRoles(),full=t>=n;return `<div class="role-slots ${full?'full':''}" role="status"><strong>Đã chọn ${t} / ${n} vai</strong><span>${full?'Đã đủ vai. Giảm một vai trước khi thêm vai khác.':'Còn '+(n-t)+' chỗ để chọn vai.'}</span>${!full?'<button class="text-btn" data-action="fill-villagers">Điền Dân làng vào chỗ trống</button>':''}</div>`}
function canAddRole(k){return !!ROLES[k]&&totalRoles()<state.players.length&&(state.roles[k]||0)<roleLimit(k)}
function changeRole(k,delta){if(!ROLES[k]||![-1,1].includes(delta)||delta>0&&!canAddRole(k)||delta<0&&!(state.roles[k]>0))return false;rememberRoleSetup();state.roles[k]=(state.roles[k]||0)+delta;state.preset='custom';state.setupAdjustment='';if(needsModerator())state.settings.mode='moderator';save();return true}
function trimRoleSelection(roles,capacity){const cleaned=Object.fromEntries(Object.keys(ROLES).map(k=>[k,Math.max(0,Math.min(roleLimit(k),Math.floor(Number(roles?.[k])||0)))]));let overflow=Object.values(cleaned).reduce((a,b)=>a+b,0)-capacity;const removed=[];for(const k of ['villager',...Object.keys(ROLES).filter(k=>k!=='villager'&&k!=='wolf').reverse(),'wolf']){if(overflow<=0)break;const amount=Math.min(cleaned[k],overflow);if(amount){cleaned[k]-=amount;overflow-=amount;removed.push(ROLES[k].name+' ×'+amount)}}return {roles:cleaned,removed}}
function resizeSetup(){setupUndo=null;if(state.preset!=='custom')applyPreset(state.preset);else save()}

ue="${esc(p)}" maxlength="28"><button data-action="remove" data-index="${i}" aria-label="Xóa người chơi ${i+1}" ${n<=5?'disabled':''}>×</button></div>`).join('')}</div><button class="add-btn" data-action="add" ${n>=24?'disabled':''}>＋ Thêm người chơi</button><p class="hint">Đặt tên để cả làng dễ gọi nhau.<br><span class="gold">Quản trò riêng không tính vào danh sách.</span></p><hr class="panel-rule"><label class="mode-label" for="mode">Ai sẽ dẫn ván chơi?</label><div class="segmented"><button data-action="mode" data-value="auto" ${needsModerator()?'disabled':''} class="${state.settings.mode==='auto'?'selected':''}">◉ Máy dẫn lượt</button><button data-action="mode" data-value="moderator" class="${state.settings.mode==='moderator'?'selected':''}">♙ Có quản trò</button></div><p class="hint">${needsModerator()?'Bộ này có vai cần quản trò. Muốn máy tự dẫn, hãy dùng bộ chỉ gồm vai Máy xử lý.':state.settings.mode==='auto'?'Mọi người đều được chơi. Vai được gọi tự cầm máy để thực hiện kỹ năng.':'Một người ngoài danh sách giữ máy, xem vai và điều khiển ván.'}</p></div></div><div class="panel" id="setupRoles"><div class="panel-head"><div class="panel-title"><span class="symbol">♧</span><h3>Bộ vai</h3></div><button class="text-btn" data-page="roles">Xem sổ vai ↗</button></div><div class="panel-body">${presetSelector()}${deckActions()}${rolePicker()}</div></div><aside class="panel summary"><div><div class="summary-label">NGÔI LÀNG ĐÊM NAY</div><div class="summary-number">${n}<small>người chơi</small></div><div class="balance"><span style="width:${Math.max(1,wolf)/Math.max(1,t)*100}%;background:#9b6d5c"></span><span style="flex:1;background:#80906f"></span>${solo?'<span style="width:10%;background:#b3a273"></span>':''}</div><div class="balance-key"><span>● <b>${wolf}</b> Sói</span><span>● <b>${t-wolf-solo}</b> Làng${solo?' · '+solo+' riêng':''}</span></div><hr class="summary-rule"><div class="setting-line"><span>Thảo luận mỗi ngày</span><b>${state.settings.minutes} phút</b></div><div class="setting-line"><span>Lộ vai khi bị loại</span><b>${state.settings.revealDeath?'Có':'Không'}</b></div><div class="setting-line"><span>Đọc lời dẫn</span><b>${state.settings.voice?'Bật':'Tắt'}</b></div><button class="text-btn" data-action="settings">Tùy chỉnh luật chơi ↗</button></div><div>${error?`<p class="error">${error}</p>`:'<p class="hint" style="text-align:left">✧ Bộ vai đã sẵn sàng.</p>'}${needsModerator()?'<p class="assist-note">Bộ có vai cần quản trò. Quản trò xử lý mọi kỹ năng và kết quả trong ván này.</p>':''}<button class="primary start" data-action="start" ${error?'disabled':''}><span>Chia vai & bắt đầu</span><span>→</span></button><p class="hint">Mỗi người chỉ được biết vai của mình.</p><p class="hint">${t===n?'Đã đủ '+n+' vai. Giảm một vai nếu muốn thay.':'Đã chọn '+t+' / '+n+' vai.'}</p></div></aside></section><div class="intro-note"><span>Chỉ cần một chiếc điện thoại. Không cần bộ bài.</span><span>Vai được xáo ngẫu nhiên cho mỗi ván.</span></div><nav class="mobile-setup-bar" aria-label="Thao tác thiết lập"><a href="#setupPlayers">Người chơi</a><a href="#setupRoles">Bộ vai ${t}/${n}</a><button class="primary" data-action="start" ${error?'disabled':''}>Vào ván →</button></nav>`}
function library(){return `<div class="page-heading"><div class="eyebrow">Hiểu vai. Giấu mặt.</div><h1>Sổ vai của ngôi làng</h1><p>150 mục: 143 vai và 7 nhóm chia ngẫu nhiên. Vai có nhãn Cần quản trò dùng bảng điều khiển hỗ trợ, không tự xử lý kỹ năng.</p></div><div class="library-search"><label class="search-label" for="librarySearch">Tìm tên hoặc kỹ năng</label><div class="search-field"><span aria-hidden="true">⌕</span><input id="librarySearch" data-library-search value="${esc(libraryQuery)}" placeholder="Nhập tên Việt, tên Anh hoặc kỹ năng…" autocomplete="off"><button data-action="library-clear" aria-label="Xóa tìm kiếm sổ vai">×</button></div></div><div class="role-filters">${[['all','Tất cả'],['village','Phe Làng'],['wolf','Phe Sói'],['solo','Phe riêng'],['neutral','Chưa có phe'],['random','Ngẫu nhiên'],['auto','Máy xử lý'],['guide','Cần quản trò']].map(([k,n])=>`<button class="secondary ${roleFilter===k?'chosen':''}" data-action="filter" data-value="${k}">${n}</button>`).join('')}</div><div id="libraryResults">${libraryCards()}</div><div class="actions"><button class="secondary" data-page="play">← Về bàn chơi</button></div>`}
function rules(){return `<div class="page-heading"><div class="eyebrow">Bạn bè ngoài đời. Đối thủ trong làng.</div><h1>Luật của màn đêm</h1><p>Chơi trực tiếp cùng 5–24 người trên một thiết bị.</p><p class="assist-note">Bộ có vai Cần quản trò: quản trò tự xử lý mọi kỹ năng, thứ tự gọi và điều kiện thắng theo mô tả vai; máy chỉ hỗ trợ ghi nhận. Luật tự động bên dưới áp dụng cho 21 vai có nhãn Máy xử lý.</p></div><section class="rules-grid"><article><h2>Một ván chơi diễn ra thế nào?</h2><ol><li><strong>Chuẩn bị:</strong> nhập tên người chơi, chọn bộ vai. Quản trò riêng không tham gia nhận vai.</li><li><strong>Nhận vai:</strong> chuyền máy theo tên. Chỉ mở vai khi đã cầm máy một mình; ẩn vai trước khi đưa cho người tiếp theo.</li><li><strong>Đêm:</strong> mọi người nhắm mắt. Chỉ vai được gọi mở mắt và cầm máy. Lần lượt: Cupid (đêm đầu), đôi tình nhân (đêm đầu), Thợ săn, Bảo vệ, Vệ sĩ, Sói pháp sư, bầy Sói, Sát nhân, Tiên tri, Tiên tri hào quang, Thám tử, Phù thủy và Cung thủ. Máy chỉ gọi những vai có trong bộ, kể cả đã bị loại để giữ kín thông tin. Không đọc tên hay kết quả kỹ năng ra tiếng.</li><li><strong>Bình minh:</strong> máy xử lý các hành động và công bố người bị loại. Thợ săn thức mỗi đêm để đặt mục tiêu. Nếu chết, phát súng tự động xử lý theo dấu đã chọn trước khi công bố bình minh.</li><li><strong>Ban ngày:</strong> thảo luận, biện hộ rồi giơ tay bỏ phiếu. Nhập số phiếu vào máy; mỗi người còn sống có một lá phiếu; Thị trưởng đã công khai được tính hai. Dùng menu Kỹ năng ban ngày để dùng nước thánh, súng hoặc tên trước khi chốt phiếu. Hòa phiếu hoặc tất cả bỏ qua thì không treo ai.</li><li><strong>Lặp lại:</strong> đêm và ngày tiếp diễn cho đến khi một phe thắng. Cuối ván mới mở toàn bộ vai.</li></ol></article><article><h2>Điều kiện thắng</h2><p class="reduced"><strong>Phe Làng:</strong> không còn Sói và Sát nhân sống.<br><br><strong>Phe Sói:</strong> số Sói sống bằng hoặc nhiều hơn những người còn lại, đồng thời không còn Sát nhân.<br><br><strong>Sát nhân:</strong> là người cuối cùng còn sống.<br><br><strong>Chán đời:</strong> thắng ngay nếu bị treo cổ ban ngày.<br><br><strong>Đôi tình nhân khác phe:</strong> nếu cả hai còn sống, họ ngăn kết thúc theo phe thông thường và chỉ thắng khi là hai người cuối cùng. Nếu một người chết, người kia chết theo.</p><hr class="panel-rule"><h2>Chơi kín & chơi offline</h2><p class="reduced">Giữ màn hình khỏi tầm nhìn người khác. Khi đổi ứng dụng hoặc tải lại trang, vai bí mật sẽ được che.<br><br>Tải bản HTML qua nút cuối trang và mở file đó bằng trình duyệt để chơi hoàn toàn không cần mạng.<br><br>Giọng đọc phụ thuộc tiếng Việt trên thiết bị và có thể cần mạng. Lời dẫn dạng chữ luôn dùng được offline.</p></article></section>`}
function render(){document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('active',el.dataset.page===page||page==='game'&&el.dataset.page==='play'));app.innerHTML=page==='play'?setup():page==='roles'?library():page==='rules'?rules():gameView();document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
function settings(){modal.innerHTML=`<div class="dialog-head"><h2>Luật của ngôi làng</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><form id="settingsForm"><label class="field"><span>Người dẫn ván</span><select name="mode"><option value="auto" ${needsModerator()?'disabled':''} ${state.settings.mode==='auto'?'selected':''}>Máy dẫn lượt — ai cũng được chơi</option><option value="moderator" ${state.settings.mode==='moderator'?'selected':''}>Có quản trò riêng</option></select><small>Áp dụng cho ván mới. Máy dẫn bằng chữ; có thể bật giọng đọc bên dưới.</small></label><label class="field"><span>Thảo luận mỗi ngày</span><select name="minutes">${[1,2,3,4,5,7,10].map(n=>`<option value="${n}" ${state.settings.minutes===n?'selected':''}>${n} phút</option>`).join('')}</select></label><label class="check"><input type="checkbox" name="revealDeath" ${state.settings.revealDeath?'checked':''}><span>Lộ vai khi bị loại<small>Mặc định tắt để giữ bí mật cho đến hết ván.</small></span></label><label class="check"><input type="checkbox" name="voice" ${state.settings.voice?'checked':''}><span>Đọc lời dẫn ban đêm<small>Chỉ đọc lời gọi chung. Giọng tiếng Việt phụ thuộc thiết bị; có thể cần mạng.</small></span></label><p class="hint">Bảo vệ không chọn cùng người hai đêm liên tiếp. Phù thủy được tự cứu. Hòa phiếu không treo ai. Sói thắng khi cân bằng quân số, trừ khi Sát nhân hoặc đôi tình nhân khác phe còn sống. Thợ săn được gọi mỗi đêm để đặt mục tiêu.</p><div class="actions"><button class="primary" type="submit">Lưu thiết lập</button></div></form>`;modal.showModal()}
function confirmBox(title,body,action,label='Xác nhận'){modal.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><p class="reduced">${body}</p><div class="actions"><button class="secondary" data-action="close">Quay lại</button><button class="primary" data-action="${action}">${label}</button></div>`;modal.showModal()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const limit=4294967296-(4294967296%(i+1));let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=limit);const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){const names=state.players.map(x=>x.trim().normalize('NFC'));if(names.some(x=>!x))return toast('Điền tên cho tất cả người chơi.');if(new Set(names.map(x=>x.toLocaleLowerCase('vi'))).size!==names.length)return toast('Mỗi người cần một tên khác nhau.');const error=configError();if(error)return toast(error);const deck=buildDeck();if(!deck)return toast('Nhóm rút không đủ vai hợp lệ. Hãy mở rộng danh sách ngẫu nhiên hoặc giảm số ô.');const manual=needsModerator()||state.settings.mode==='moderator';state.game={players:names.map((name,i)=>({id:i,name,photo:cleanPhoto(state.photos[i]),role:deck[i],initialRole:deck[i],alive:true})),manual,houseRules:{...state.houseRules},settings:{...state.settings},stage:'deal',dealIndex:0,round:1,queue:[],nightIndex:0,night:{},lovers:[],lastGuard:null,healUsed:false,poisonUsed:false,hunterUsed:false,hunters:[],afterHunter:'dawn',log:[],dawn:[],votes:{},winner:null};ensureGame(state.game);ensureModerator(state.game);state.game.voteMode='ballots';page='game';secret=false;selected=[];save();render();window.scrollTo(0,0)}
function addLog(s){state.game.log.push(s)}
function beginNight(){stopTimer();const g=state.game;ensureGame(g);g.stage='night';g.night={};g.nightIndex=0;g.statusIndex=0;g.queue=[];if(g.round===1&&alive().some(p=>p.role==='cupid'))g.queue.push('cupid','lovers');if(g.round>1&&g.players.some(p=>['cursed','ext_seer_apprentice','ext_junior_werewolf'].includes(p.initialRole)))g.queue.push('status');for(const r of NIGHT_ORDER)if(r==='wolf'?g.players.some(isWolf):g.players.some(p=>p.role===r||p.initialRole===r))g.queue.push(r);secret=false;selected=[];nightResult=null;g.votes={};g.ballots={};g.publicReport=[];addLog('Đêm '+g.round+' bắt đầu.');save();render()}
function speak(s){if(!state.game?.settings.voice||!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices(),v=voices.find(x=>x.lang.startsWith('vi'));if(!v){toast('Thiết bị chưa có giọng tiếng Việt. Hãy đọc lời dẫn trên màn hình.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='vi-VN';u.voice=v;u.rate=.85;speechSynthesis.speak(u)}
function nextNight(){const g=state.game;g.nightIndex++;window.scrollTo(0,0);secret=false;selected=[];nightResult=null;if('speechSynthesis'in window)speechSynthesis.cancel();if(g.nightIndex>=g.queue.length)resolveNight();else{save();render()}}
function eliminate(ids,cause){const g=state.game,newDead=[],pending=[...new Set(ids)].filter(x=>x!==null&&x!==undefined);while(pending.length){const id=pending.shift(),p=byId(id);if(!p||!p.alive)continue;p.alive=false;newDead.push(id);addLog(p.name+' bị loại ('+cause+').');if(g.lovers.includes(id)){const mate=g.lovers.find(x=>x!==id);if(byId(mate)?.alive)pending.push(mate)}if(p.role==='hunter'&&!g.hunterUsed){g.hunterUsed=true;if(g.hunterTarget!=null&&byId(g.hunterTarget)?.alive){pending.push(g.hunterTarget);addLog('Phát súng Thợ săn kéo theo '+byId(g.hunterTarget).name+'.')}}if(p.role==='ext_junior_werewolf'&&!g.juniorUsed){g.juniorUsed=true;const target=byId(g.juniorTarget);if(target?.alive&&!isWolf(target)){if(target.role==='cursed'){target.role='wolf';addLog(target.name+' hóa Ma sói do dấu Sói con.')}else pending.push(target.id)}}}if(!g.manual){const informer=newDead.map(byId).find(p=>['seer','aura','detective','ext_analyst'].includes(p.role));if(informer)for(const p of alive().filter(p=>p.role==='ext_seer_apprentice')){p.role=informer.role;p.infos=structuredClone(informer.infos||[]);p.restRound=0;addLog(p.name+' kế thừa '+ROLES[informer.role].name+'.')}}return newDead}
function resolveNight(){const g=state.game,n=g.night;ensureGame(g);g.lastGuard=n.guard??null;const deaths=[];function attack(id,kind){const p=byId(id);if(!p?.alive)return;if(kind==='wolf'&&(n.heal||p.role==='serial'))return;if(id===n.guard)return;const bg=alive().find(p=>p.role==='bodyguard');const recipient=bg&&n.bodyguard===id?bg:p;if(recipient.role==='bodyguard'){g.bodyguardHits++;if(g.bodyguardHits<2){addLog('Vệ sĩ chịu một đòn tấn công.');return}}if(kind==='wolf'&&recipient.role==='cursed'){recipient.role='wolf';addLog(recipient.name+' chuyển từ Người bị nguyền thành Ma sói.');return}deaths.push(recipient.id)}if(n.serial!=null)attack(n.serial,'serial');if(n.wolf!=null)attack(n.wolf,'wolf');if(n.poison!=null)deaths.push(n.poison);if(n.marksmanShot!=null){const p=byId(n.marksmanShot),shooter=alive().find(p=>p.role==='marksman');if(p&&shooter)deaths.push(faction(p)==='village'?shooter.id:p.id)}g.dawn=eliminate(deaths,'đêm '+g.round);g.afterHunter='dawn';g.stage='dawn';secret=false;save();render()}
function winner(){const g=state.game,ps=alive(),wolves=ps.filter(isWolf).length,killers=ps.filter(p=>p.role==='serial').length,pair=g.lovers.map(byId);if(!ps.length)return 'draw';const mixed=pair.length===2&&pair.every(p=>p?.alive)&&faction(pair[0])!==faction(pair[1]);if(mixed)return ps.length===2?'lovers':null;if(killers)return ps.length===1?'serial':null;if(!wolves)return 'village';if(wolves>=ps.length-wolves)return 'wolves';return null}
function checkWin(){const w=winner();if(!w)return false;state.game.winner=w;state.game.stage='over';stopTimer();save();return true}
function afterHunter(){const g=state.game;secret=false;selected=[];if(g.hunters.length)g.stage='hunter';else if(g.afterHunter==='dawn')g.stage='dawn';else if(!checkWin()){g.round++;beginNight();return}save();render()}
function targetGrid(players,multiple=false){return `<div class="player-grid">${players.map(p=>`<button class="target ${selected.includes(p.id)?'chosen':''}" data-action="target" data-id="${p.id}" ${multiple?'data-multiple="true"':''}>${avatar(p)}<span>${esc(p.name)}</span></button>`).join('')}</div>`}
function gate(title,text,button='Tôi đã cầm máy'){return `<span class="large-symbol">${icon('moon')}</span><div class="eyebrow">Mọi người khác hãy nhắm mắt</div><h1>${title}</h1><p>${text}</p><button class="primary" data-action="unlock">${button} →</button>`}
function gameView(){const g=state.game;if(!g){page='play';return setup()}if(g.manual&&!['deal','ready'].includes(g.stage))return moderatorView();const head=`<div class="game-wrap"><div class="game-top"><p>✦ ${g.stage==='deal'?'CHIA VAI BÍ MẬT':g.stage==='over'?'KẾT THÚC VÁN':'ĐÊM LÀNG · VÒNG '+g.round}</p><div style="display:flex;gap:16px"><button class="text-btn" data-action="veil">◈ Che màn hình</button><button class="text-btn" data-action="exit">Về bàn chơi</button></div></div><section class="game-stage">`;let body='';
 if(g.stage==='deal'){const p=g.players[g.dealIndex],r=ROLES[p.role];body=secret?`<div class="eyebrow">Chỉ ${esc(p.name)} được xem</div><div class="role-reveal"><span class="large-symbol">${icon(p.role)}</span><div class="faction">${r.team}</div><h2>${r.name}</h2><p>${r.desc}</p></div><button class="primary" data-action="deal-next">Ẩn vai & ${g.dealIndex===g.players.length-1?'vào làng':'chuyền máy'} →</button>`:`<span class="large-symbol">${icon('lock')}</span><div class="eyebrow">Người chơi ${g.dealIndex+1} / ${g.players.length}</div>${avatar(p,true)}<h1>${esc(p.name)}</h1><p>Hãy nhận máy, đảm bảo không ai nhìn màn hình.<br>Vai của bạn đang chờ phía sau.</p><button class="primary" data-action="unlock">Xem vai của tôi</button><div class="progress"><div style="width:${g.dealIndex/g.players.length*100}%"></div></div>`}
 else if(g.stage==='ready'){body=`<span class="large-symbol">${icon('moon')}</span><div class="eyebrow">Tất cả đã nhận vai</div><h1>Ngôi làng chìm vào giấc ngủ.</h1><p>${g.settings.mode==='moderator'?'Đưa máy cho quản trò. Quản trò không nằm trong danh sách người chơi và sẽ điều khiển các lượt.':'Đặt máy ở giữa. Mọi người nhắm mắt. Khi được gọi, vai đó mở mắt và cầm máy thực hiện kỹ năng. Nhớ ẩn màn hình trước khi đặt xuống.'}</p><p class="hint">${g.manual?'Quản trò giữ máy trong cả ván, ghi kỹ năng và tự xử lý kết quả trên bảng riêng.':'Máy dẫn lượt bằng chữ'+(g.settings.voice?' và giọng đọc trên thiết bị':'')+'. Sau mỗi lượt, bấm gọi vai tiếp theo; người bấm chỉ nhìn màn hình lời gọi chung.'}</p><button class="primary" data-action="begin-night">Bắt đầu đêm đầu tiên →</button>`}
 else if(g.stage==='night')body=nightView();
 else if(g.stage==='power')body=dayPowerView();
 else if(g.stage==='dawn'){body=`<span class="large-symbol">${icon('sun')}</span><div class="eyebrow">Bình minh · Ngày ${g.round}</div><h1>${g.dawn.length?'Đêm qua, làng mất đi…':'Một đêm bình yên.'}</h1><p>${g.dawn.length?g.dawn.map(id=>{const p=byId(id);return '<strong>'+esc(p.name)+'</strong>'+(g.settings.revealDeath?' — '+ROLES[p.role].name:'')}).join('<br>'):'Không có ai bị loại đêm qua. Nhưng Sói vẫn đang ở đây.'}</p><button class="primary" data-action="day">Cả làng thức dậy →</button>`}
 else if(g.stage==='day'){body=`<div class="eyebrow">Ngày ${g.round} · ${alive().length} người còn sống</div><h1>Đã đến lúc nghi ngờ.</h1><p>Ai đang nói thật? Ai giấu đôi nanh sau nụ cười?<br>Thảo luận cùng nhau trước khi đưa ra lá phiếu.</p><div class="timer" id="timer">${formatTime(timerRunning?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerLeft)}</div><div class="actions"><button class="secondary" data-action="timer">${timerRunning?'Tạm dừng':'Bắt đầu đếm giờ'}</button><button class="text-btn" data-action="timer-reset">↻ Đặt lại</button></div><div class="alive-strip">${alive().map(p=>`<span>${esc(p.name)}</span>`).join('')}</div><div class="actions"><button class="secondary" data-action="powers">Kỹ năng ban ngày</button><button class="primary" data-action="vote">Đến lượt bỏ phiếu →</button></div>${publicReportView()}`}
 else if(g.stage==='vote')body=voteView();
 else if(g.stage==='hunter'){const p=byId(g.hunters[0]);body=!secret?gate('Thợ săn, phát súng cuối cùng.',`${esc(p.name)} đã bị loại. Người này cầm máy và chọn một người để bắn, hoặc bỏ qua.`):`<div class="eyebrow">Thợ săn · ${esc(p.name)}</div><h1>Bạn chọn ai đi cùng?</h1><p>Phát súng bỏ qua mọi lớp bảo vệ.</p>${targetGrid(alive())}<div class="actions"><button class="secondary" data-action="hunter-skip">Không bắn</button><button class="primary" data-action="hunter-fire" ${selected.length!==1?'disabled':''}>Bắn & ẩn màn hình</button></div>`}
 else if(g.stage==='over'){const labels={village:['villager','Phe Làng chiến thắng.','Ngôi làng đã thoát khỏi những chiếc nanh.'],wolves:['wolf','Phe Sói chiến thắng.','Màn đêm đã nuốt chửng ngôi làng.'],lovers:['cupid','Tình yêu chiến thắng.','Hai người cuối cùng, vượt qua mọi phe phái.'],jester:['jester','Chán đời chiến thắng.','Cả làng đã treo đúng người muốn bị treo.'],serial:['serial','Sát nhân chiến thắng.','Một người duy nhất còn sống sau tất cả.'],draw:['moon','Không ai sống sót.','Ván chơi kết thúc hòa.']},v=labels[g.winner];body=`<span class="large-symbol">${icon(v[0])}</span><div class="eyebrow">Mọi bí mật được hé lộ</div><h1>${v[1]}</h1><p>${v[2]}</p><div class="results-list">${g.players.map(p=>`<div><span class="role-symbol">${icon(p.role)}</span>${avatar(p)}<span><b>${esc(p.name)}</b><small>${ROLES[p.role].name}${p.initialRole&&p.initialRole!==p.role?' (ban đầu: '+ROLES[p.initialRole].name+')':''} · ${p.alive?'Còn sống':'Đã bị loại'}${g.lovers.includes(p.id)?' · ♥':''}</small></span></div>`).join('')}</div><details class="log"><summary>Nhật ký ván chơi</summary><ol>${g.log.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details><div class="actions"><button class="secondary" data-action="exit">Về bàn chơi</button><button class="primary" data-action="replay">Chơi lại cùng nhóm →</button></div>`}
 if(g.settings.mode==='moderator'&&!['deal','ready','over'].includes(g.stage))body+='<div class="actions"><button class="text-btn" data-action="moderator">♙ Sổ bí mật của quản trò</button></div>';

function recountVotes(){const g=state.game;g.votes={};for(const p of alive()){const target=Number(g.ballots[p.id]);if(g.ballots[p.id]!=null&&g.ballots[p.id]!==''&&byId(target)?.alive){const weight=p.role==='mayor'&&g.mayorRevealed?2:1;g.votes[target]=(g.votes[target]||0)+weight}}}
function voteView(){const g=state.game;if(g.voteMode!=='ballots')return legacyVoteView();recountVotes();const ps=alive();return `<div class="eyebrow">Bỏ phiếu · Ngày ${g.round}</div><h1>Ai sẽ rời ngôi làng?</h1><p>Chọn lá phiếu của từng người theo kết quả giơ tay. Thị trưởng đã công khai có trọng số 2. Để Bỏ qua nếu người đó không bỏ phiếu.</p><div class="ballot-list">${ps.map(p=>`<label class="ballot-row"><span>${esc(p.name)}${p.role==='mayor'&&g.mayorRevealed?' <b>×2</b>':''}</span><select aria-label="Lá phiếu của ${esc(p.name)}" data-ballot="${p.id}"><option value="">Bỏ qua</option>${ps.map(t=>`<option value="${t.id}" ${String(g.ballots[p.id])===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>`).join('')}</div><div class="public-report"><h2>Kiểm phiếu</h2>${ps.map(p=>`<div class="tally-row"><span>${esc(p.name)}</span><b>${g.votes[p.id]||0}</b></div>`).join('')}</div><p class="hint">Hòa phiếu hoặc không có phiếu: không treo ai.</p><div class="actions"><button class="secondary" data-action="back-day">← Thảo luận tiếp</button><button class="primary" data-action="vote-confirm">Chốt phiếu →</button></div>`}

function legacyVoteView(){const g=state.game,cast=Object.values(g.votes).reduce((a,b)=>a+b,0);return `<div class="eyebrow">Bỏ phiếu · Ngày ${g.round}</div><h1>Ai sẽ rời ngôi làng?</h1><p>Cả nhóm giơ tay bỏ phiếu ngoài đời. Nhập tổng số phiếu từng người nhận được. Mỗi người còn sống có tối đa một phiếu; số chưa nhập được tính là bỏ qua.</p><div>${alive().map(p=>`<div class="vote-row">${avatar(p)}<span class="name">${esc(p.name)}</span><div class="stepper"><button data-action="vote-count" data-id="${p.id}" data-delta="-1" aria-label="Giảm phiếu cho ${esc(p.name)}" ${!(g.votes[p.id]>0)?'disabled':''}>−</button><span>${g.votes[p.id]||0}</span><button data-action="vote-count" data-id="${p.id}" data-delta="1" aria-label="Thêm phiếu cho ${esc(p.name)}" ${cast>=alive().length?'disabled':''}>+</button></div></div>`).join('')}</div><p class="hint">${cast} / ${alive().length} phiếu · ${alive().length-cast} bỏ qua · Hòa phiếu: không treo ai.</p><div class="actions"><button class="secondary" data-action="back-day">← Thảo luận tiếp</button><button class="primary" data-action="vote-confirm">Chốt phiếu →</button></div>`}
function voteOutcome(){const g=state.game,v=alive().map(p=>({id:p.id,votes:g.votes[p.id]||0})),max=Math.max(...v.map(x=>x.votes)),top=v.filter(x=>x.votes===max);return max>0&&top.length===1?top[0].id:null}
function resolveVote(){const g=state.game,id=voteOutcome();if(id!=null){const p=byId(id);if(p.role==='jester'){p.alive=false;g.winner='jester';g.stage='over';addLog(p.name+' (Chán đời) bị treo cổ và thắng riêng.');save();render();return}const dead=eliminate([id],'bỏ phiếu ngày '+g.round);g.dawn=[];g.afterHunter='vote';if(g.hunters.length){g.stage='hunter';secret=false;selected=[];save();render();return}toast(dead.map(x=>byId(x).name).join(', ')+' bị loại.')}else addLog('Ngày '+g.round+': hòa phiếu hoặc không có phiếu. Không ai bị treo.');if(!checkWin()){g.round++;beginNight()}else render()}

document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.matches('.brand')){e.preventDefault();page='play';veil();render();window.scrollTo(0,0);return}if(el.dataset.page){secret=false;selected=[];nightResult=null;page=el.dataset.page;render();window.scrollTo(0,0);return}const a=el.dataset.action,g=state.game;switch(a){case 'add':if(state.players.length<24){let label=state.players.length+1;while(state.players.includes('Người chơi '+label))label++;state.players.push('Người chơi '+label);state.photos.push('');resizeSetup();render()}break;case 'remove':if(removeSetupPlayer(Number(el.dataset.index)))render();break;case 'role':if(changeRole(el.dataset.role,Number(el.dataset.delta)))render();break;case 'filter':roleFilter=el.dataset.value;libraryLimit=24;render();break;case 'preset':if(el.dataset.value!=='custom')choosePreset(el.dataset.value);else{state.preset='custom';save()}render();if(el.dataset.value!=='custom')closeSuggestions();break;case 'mode':if(el.dataset.value==='auto'&&needsModerator())break;state.settings.mode=el.dataset.value;save();render();break;case 'expand':expanded=!expanded;render();break;case 'settings':settings();break;case 'close':modal.close();if(page==='play')render();break;case 'start':if(g&&!['over','manual-over'].includes(g.stage))confirmBox('Bắt đầu ván mới?','Ván đang chơi sẽ được thay bằng ván mới.','start-confirm','Chia vai ván mới');else newGame();break;case 'start-confirm':modal.close();newGame();break;case 'resume':page='game';veil();if(g.stage==='day'&&timerLeft===0)timerLeft=g.settings.minutes*60;render();window.scrollTo(0,0);break;case 'exit':secret=false;selected=[];nightResult=null;page='play';render();window.scrollTo(0,0);break;case 'replay':newGame();break;case 'unlock':secret=true;selected=[];nightResult=null;render();break;case 'deal-next':secret=false;g.dealIndex++;if(g.dealIndex>=g.players.length)g.stage='ready';save();render();break;case 'begin-night':if(g.manual){startModeratorNight();break}beginNight();speak('Cả làng đi ngủ. '+roleName(g.queue[0])+', hãy thức dậy.');break;case 'veil':veil();break;case 'target':{const id=Number(el.dataset.id);if(el.dataset.multiple){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<2)selected.push(id);else toast('Chỉ chọn hai người. Bấm vào người đã chọn để bỏ chọn.')}else selected=selected.includes(id)?[]:[id];render();break}case 'night-next':nextNight();if(g.stage==='night')speak(roleName(g.queue[g.nightIndex])+', hãy thức dậy.');break;case 'night-skip':if(g.queue[g.nightIndex]==='ext_junior_werewolf')g.juniorTarget=null;if(g.queue[g.nightIndex]==='hunter')g.hunterTarget=null;addLog('Đêm '+g.round+': '+ROLES[g.queue[g.nightIndex]].name+' bỏ qua kỹ năng.');nextNight();if(g.stage==='night')speak(roleName(g.queue[g.nightIndex])+', hãy thức dậy.');break;case 'night-confirm':handleNightConfirm();break;case 'seer-done':if(nightResult){addLog('Đêm '+g.round+': '+roleName(g.queue[g.nightIndex])+' xem '+nightResult.names+' — '+nightResult.title);nextNight();speakNext()}break;case 'witch-done':{const heal=document.getElementById('healChoice')?.checked;if(heal&&!g.healUsed&&g.night.wolf!=null){g.night.heal=true;g.healUsed=true;addLog('Đêm '+g.round+': Phù thủy dùng bình cứu.')}if(selected.length&&!g.poisonUsed){g.night.poison=selected[0];g.poisonUsed=true;addLog('Đêm '+g.round+': Phù thủy đầu độc '+byId(selected[0]).name+'.')}nextNight();speakNext();break}case 'day':if(!checkWin()){g.stage='day';timerLeft=g.settings.minutes*60;save()}render();break;case 'timer':toggleTimer();break;case 'timer-reset':stopTimer();timerLeft=g.settings.minutes*60;render();break;case 'vote':stopTimer();g.stage='vote';save();render();break;case 'back-day':g.stage='day';save();render();break;case 'powers':openPowers();break;case 'power-open':modal.close();g.powerRole=el.dataset.role;g.stage='power';secret=false;selected=[];save();render();window.scrollTo(0,0);break;case 'power-back':g.stage='day';secret=false;selected=[];save();render();break;case 'power-confirm':confirmBox('Dùng kỹ năng công khai?','Hành động sẽ công khai vai và có thể loại người ngay lập tức.','power-use','Dùng kỹ năng');break;case 'power-use':modal.close();useDayPower();break;case 'status-next':g.statusIndex=(g.statusIndex||0)+1;secret=false;if(g.statusIndex>=alive().length){nextNight();speakNext()}else{save();render()}break;case 'marksman-night-shoot':if(g.arrows>0&&byId(g.mark)?.alive&&g.round>g.markRound){g.night.marksmanShot=g.mark;g.arrows--;g.mark=null;addLog('Đêm '+g.round+': Cung thủ bắn mục tiêu đã đánh dấu.');nextNight();speakNext()}break;case 'vote-count':{const id=el.dataset.id,delta=Number(el.dataset.delta),sum=Object.values(g.votes).reduce((a,b)=>a+b,0);if(delta>0&&sum>=alive().length)break;g.votes[id]=Math.max(0,(g.votes[id]||0)+delta);save();render();break}case 'vote-confirm':{const id=voteOutcome();confirmBox('Chốt quyết định của làng?',id==null?'Hòa phiếu hoặc không có phiếu. Không ai bị treo cổ.':esc(byId(id).name)+' nhận nhiều phiếu nhất và sẽ bị treo cổ.','vote-resolve','Chốt kết quả');break}case 'vote-resolve':modal.close();resolveVote();break;case 'hunter-fire':if(selected.length!==1)break;{const dead=eliminate([selected[0]],'phát súng Thợ săn');g.dawn.push(...dead);g.hunterUsed=true;g.hunters.shift();toast(dead.map(x=>byId(x).name).join(', ')+' bị loại.');afterHunter();break}case 'hunter-skip':g.hunterUsed=true;g.hunters.shift();addLog('Thợ săn bỏ qua phát súng.');afterHunter();break;case 'moderator':confirmBox('Chỉ dành cho quản trò','Màn hình tiếp theo sẽ hiển thị toàn bộ vai. Đảm bảo không có người chơi nhìn thấy.','moderator-open','Tôi là quản trò');break;case 'moderator-open':modal.close();moderatorBook();break;}});

function photoFromSource(source,w,h){if(!w||!h||w*h>60000000)throw Error('Ảnh quá lớn hoặc chưa sẵn sàng.');const canvas=document.createElement('canvas');canvas.width=192;canvas.height=192;const context=canvas.getContext('2d'),side=Math.min(w,h);context.drawImage(source,(w-side)/2,(h-side)/2,side,side,0,0,192,192);return canvas.toDataURL('image/jpeg',.78)}
async function loadPhotoFile(file){if(!file)return;if(file.size>15*1024*1024)return toast('Ảnh tối đa 15 MB.');if(file.type==='image/svg+xml'||!file.type.startsWith('image/'))return toast('Chọn ảnh JPEG, PNG, WebP hoặc ảnh chụp thông thường.');const url=URL.createObjectURL(file);try{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url});photoDraft=photoFromSource(im,im.naturalWidth,im.naturalHeight);photoModal()}catch(e){toast('Không mở được ảnh này. Thử JPEG hoặc PNG.')}finally{URL.revokeObjectURL(url)}}

function ensureModerator(g){if(!g)return;g.mod??={phase:'night',step:0,queue:[],records:[],snapshots:[],pending:[],report:[],result:'',winnerIds:[]};g.players.forEach(p=>{p.modTeam??=ROLES[p.role]?.team||'Phe riêng';p.modVotes??=1;p.modBlocked??=false;p.modMuted??=false;p.modProtected??=false;p.modNotes??='';p.modCounter??=0;p.modDeadVotes??=false});}
function modSnapshot(){const g=state.game;ensureModerator(g);g.mod.snapshots.push({label:`${g.mod.phase==='night'?'Đêm':'Ngày'} ${g.round}`,round:g.round,phase:g.mod.phase,players:g.players.map(({photo,...p})=>structuredClone(p)),records:structuredClone(g.mod.records),ballots:structuredClone(g.ballots),pending:[...g.mod.pending],report:[...g.mod.report],lovers:[...g.lovers],hunterTarget:g.hunterTarget,hunterUsed:g.hunterUsed,queue:[...g.mod.queue],step:g.mod.step});if(g.mod.snapshots.length>12)g.mod.snapshots.shift()}
function startModeratorNight(){const g=state.game;ensureModerator(g);if(g.stage==='ready'){g.stage='moderator';g.mod.phase='night'}else{g.round++;g.mod.phase='night'}g.mod.report=[];g.mod.pending=[];g.mod.step=0;g.mod.queue=[...new Set(g.players.flatMap(p=>[p.initialRole,p.role]))].filter(k=>ROLES[k]&&(['night','both'].includes(ROLES[k].phase)||g.round===1&&ROLES[k].phase==='setup')).sort((a,b)=>(a==='hunter'?-100:ROLES[a].phase==='setup'?-50:ROLES[a].group==='wolf'?10:0)-(b==='hunter'?-100:ROLES[b].phase==='setup'?-50:ROLES[b].group==='wolf'?10:0));g.ballots={};g.votes={};secret=false;selected=[];modSnapshot();addLog('Đêm '+g.round+' · quản trò điều khiển.');save();render();window.scrollTo(0,0)}
function moderatorView(){const g=state.game;ensureModerator(g);const m=g.mod,header=`<div class="game-wrap moderator-wrap"><div class="game-top"><p>${g.stage==='manual-over'?'KẾT THÚC VÁN':'QUẢN TRÒ HỖ TRỢ · '+(m.phase==='night'?'ĐÊM ':'NGÀY ')+g.round}</p><div>${g.stage!=='manual-over'?'<button class="text-btn" data-action="mod-public">Màn hình chung</button>':''}<button class="text-btn" data-action="exit">Về bàn chơi</button></div></div>`;
if(g.stage==='manual-over')return header+`<section class="game-stage"><span class="large-symbol">${icon('sun')}</span><h1>${esc(m.result||'Ván đã kết thúc.')}</h1><p>Kết quả do quản trò xác nhận.</p><div class="results-list">${g.players.map(p=>`<div>${avatar(p)}<span><b>${esc(p.name)} ${m.winnerIds.includes(p.id)?'★':''}</b><small>${ROLES[p.role].name} · ${esc(p.modTeam)} · ${p.alive?'Còn sống':'Đã bị loại'}</small></span></div>`).join('')}</div><details class="log"><summary>Nhật ký quản trò</summary><ol>${g.log.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details><div class="actions"><button class="secondary" data-action="exit">Về bàn chơi</button><button class="primary" data-action="replay">Chơi lại cùng nhóm</button></div></section></div>`;
if(g.stage==='mod-public')return header+`<section class="game-stage"><span class="large-symbol">${icon(m.phase==='night'?'moon':'sun')}</span><h1>${m.phase==='night'?'Cả làng nhắm mắt.':'Cả làng thức dậy.'}</h1><p>${m.phase==='night'?'Quản trò lần lượt gọi các vai. Chỉ người được gọi mở mắt.':'Thảo luận và bỏ phiếu theo hướng dẫn của quản trò.'}</p>${m.report.length?`<div class="public-report">${m.report.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`:''}<div class="alive-strip">${g.players.filter(p=>p.alive).map(p=>`<span>${esc(p.name)}</span>`).join('')}</div><button class="primary" data-action="mod-private">Quay lại bảng quản trò</button></section></div>`;
if(!secret)return header+`<section class="game-stage">${gate('Chỉ quản trò cầm máy.','Bảng tiếp theo hiển thị toàn bộ vai và thông tin bí mật. Mọi người khác tránh nhìn màn hình.','Tôi là quản trò')}</section></div>`;
const current=m.queue[m.step],voters=g.players.filter(p=>p.alive||p.modDeadVotes);return header+`<div class="assist-note"><strong>Quản trò tự xử lý kỹ năng và xét thắng.</strong> Bảng hỗ trợ ghi lựa chọn, đổi vai, loại/hồi sinh và tính phiếu. Không tự suy diễn tương tác của bộ vai mở rộng.</div><div class="mod-toolbar"><button class="secondary" data-action="mod-undo" ${m.snapshots.length?'':'disabled'}>Hoàn tác mốc gần nhất</button><button class="secondary" data-action="mod-finish">Công bố kết quả</button><button class="secondary" data-action="mod-public">Che vai · màn hình chung</button></div><section class="panel mod-night-guide"><div class="panel-head"><h2>${m.phase==='night'?'Lời gọi & kỹ năng đêm':'Điều khiển ban ngày'}</h2><span>${m.phase==='night'?Math.min(m.step+1,m.queue.length)+' / '+m.queue.length:'Ngày '+g.round}</span></div><div class="panel-body">${m.phase==='night'?current?`<h3>${ROLES[current].name}, hãy thức dậy.</h3><p class="english-name">${ROLES[current].english} · vẫn gọi sau khi vai đã chết</p><p>${ROLES[current].desc}</p>${g.houseRules[current]?`<p class="assist-note">Luật nhóm: ${esc(g.houseRules[current])}</p>`:''}<div class="target-guide">${g.players.filter(p=>p.initialRole===current||p.role===current).map(p=>`<span>${avatar(p)}${esc(p.name)} · ${p.alive?'còn sống':'đã bị loại'}</span>`).join('')}</div><label class="field"><span>Ghi lựa chọn / hiệu ứng / thời hạn</span><textarea id="modNightNote" rows="2" maxlength="1500" placeholder="Ví dụ: bảo vệ Minh đêm 2; 1 lượt còn lại…">${esc(m.draft||'')}</textarea></label><label class="field"><span>${current==='hunter'?'Dấu Thợ săn (tự bắn khi bị loại)':'Mục tiêu ghi nhận (không tự áp dụng kỹ năng)'}</span><select id="modNightTarget"><option value="">Không chọn</option>${g.players.filter(p=>p.alive&&(current!=='hunter'||p.role!=='hunter')).map(p=>`<option value="${p.id}" ${String(m.draftTarget)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="actions"><button class="secondary" data-action="mod-prev" ${m.step?'':'disabled'}>← Vai trước</button><button class="primary" data-action="mod-next">Lưu lượt & gọi vai sau →</button></div>`:'<p>Đã gọi hết lượt. Kiểm tra các hiệu ứng, người bị loại và chuyển sang bình minh.</p>':`<p>Dùng hồ sơ từng người để xử lý kỹ năng công khai, chỉnh số phiếu, cấm nói hoặc cấm kỹ năng.</p><button class="secondary" data-action="mod-votes">Mở bảng bỏ phiếu</button>`}<div class="actions">${m.phase==='night'?'<button class="primary" data-action="mod-dawn">Xác nhận bình minh →</button>':'<button class="primary" data-action="mod-night">Bắt đầu đêm kế tiếp →</button>'}</div></div></section><section class="mod-player-grid">${g.players.map(p=>`<button class="mod-player ${p.alive?'':'dead'}" data-action="mod-player" data-id="${p.id}">${avatar(p,true)}<span><b>${esc(p.name)}</b><strong>${ROLES[p.role].name}</strong><small>${esc(p.modTeam)} · ${p.alive?'Còn sống':'Đã bị loại'} · phiếu ×${p.modVotes}${p.modDeadVotes?' · được bỏ phiếu khi chết':''}</small><small>${p.modBlocked?'Khóa kỹ năng · ':''}${p.modMuted?'Cấm nói · ':''}${p.modProtected?'Có bảo vệ · ':''}${p.modCounter?'Điểm/lượt: '+p.modCounter:''}</small>${p.modNotes?`<small>${esc(p.modNotes.slice(0,100))}</small>`:''}</span></button>`).join('')}</section><details class="log"><summary>Ghi nhận kỹ năng (${m.records.length})</summary><ol>${m.records.slice(-30).map(r=>`<li>${esc(r)}</li>`).join('')}</ol></details></div>`}
function modOptions(query,current){return Object.entries(ROLES).filter(([k,r])=>!r.random&&roleMatches(k,query,'all')).map(([k,r])=>`<option value="${k}" ${k===current?'selected':''}>${r.name} · ${r.english}</option>`).join('')}
let modPlayerId=null;
function showModPlayer(id){const g=state.game,p=byId(id);modPlayerId=id;modal.innerHTML=`<div class="dialog-head"><h2>${esc(p.name)}</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><div class="mod-profile">${avatar(p,true)}<p>${ROLES[p.role].name}<br><small>${esc(p.modTeam)} · ${p.alive?'Còn sống':'Đã bị loại'}</small></p></div><form id="modPlayerForm"><label class="field"><span>Tìm vai để đổi</span><input id="modRoleSearch" placeholder="Tên Việt hoặc Anh…" autocomplete="off"></label><label class="field"><span>Vai hiện tại</span><select id="modRole" name="role">${modOptions('',p.role)}</select></label><label class="field"><span>Phe / nhóm thắng hiện tại</span><input name="team" value="${esc(p.modTeam)}" maxlength="60" required></label><div class="mod-form-grid"><label class="field"><span>Trọng số lá phiếu</span><input name="weight" type="number" min="0" max="20" value="${p.modVotes}"></label><label class="field"><span>Điểm / lượt kỹ năng</span><input name="counter" type="number" min="0" max="99" value="${p.modCounter}"></label></div><label class="check"><input type="checkbox" name="blocked" ${p.modBlocked?'checked':''}><span>Khóa kỹ năng</span></label><label class="check"><input type="checkbox" name="muted" ${p.modMuted?'checked':''}><span>Cấm nói</span></label><label class="check"><input type="checkbox" name="protected" ${p.modProtected?'checked':''}><span>Đang có bảo vệ</span></label><label class="check"><input type="checkbox" name="deadVotes" ${p.modDeadVotes?'checked':''}><span>Cho bỏ phiếu dù đã chết (ví dụ: Sói ma)</span></label><label class="field"><span>Ghi chú & thời hạn hiệu ứng</span><textarea name="notes" maxlength="1500" rows="3">${esc(p.modNotes)}</textarea></label><div class="actions"><button class="primary" type="submit">Lưu hồ sơ</button><button class="secondary" type="button" data-action="mod-alive-confirm" data-id="${p.id}">${p.alive?'Loại người này':'Hồi sinh người này'}</button><button class="text-btn" type="button" data-action="mod-role-info" data-role="${p.role}">Xem kỹ năng vai</button></div></form>`;modal.showModal()}
function modSetAlive(id,value){const g=state.game;ensureModerator(g);modSnapshot();const pending=[id],changed=[];while(pending.length){const p=byId(pending.shift());if(!p||p.alive===value)continue;p.alive=value;changed.push(p.id);if(!value&&p.role==='hunter'&&!g.hunterUsed){g.hunterUsed=true;if(g.hunterTarget!=null&&byId(g.hunterTarget)?.alive)pending.push(g.hunterTarget)}}if(!value)g.mod.pending.push(...changed.filter(id=>!g.mod.pending.includes(id)));else g.mod.pending=g.mod.pending.filter(id=>!changed.includes(id));const report=changed.map(id=>byId(id).name).join(', ')+' '+(value?'được hồi sinh.':'bị loại.');g.mod.records.push(report);addLog(report);g.ballots={};g.votes={};save();return changed}
function showModVotes(){const g=state.game,ps=g.players.filter(p=>p.alive||p.modDeadVotes);modal.innerHTML=`<div class="dialog-head"><h2>Phiếu do quản trò nhập</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><p class="hint">Máy tính tổng theo trọng số. Quản trò tự xét miễn treo, phiếu giả, phe riêng và các hiệu ứng khác trước khi loại người.</p><div class="ballot-list">${ps.map(p=>`<label class="ballot-row"><span>${esc(p.name)} ×${p.modVotes}${p.alive?'':' · đã chết'}</span><select data-mod-ballot="${p.id}" aria-label="Phiếu quản trò của ${esc(p.name)}"><option value="">Bỏ qua</option>${g.players.filter(p=>p.alive).map(t=>`<option value="${t.id}" ${String(g.ballots[p.id])===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>`).join('')}</div><div id="modTally">${modTallyView()}</div>`;modal.showModal()}
function modTally(){const g=state.game,tally={};g.players.filter(p=>p.alive||p.modDeadVotes).forEach(p=>{const raw=g.ballots[p.id],id=Number(raw);if(raw!=null&&raw!==''&&byId(id)?.alive)tally[id]=(tally[id]||0)+Math.max(0,Math.min(20,p.modVotes))});return tally}
function modTallyView(){const tally=modTally();return `<div class="public-report"><h3>Kiểm phiếu</h3>${state.game.players.filter(p=>p.alive).map(p=>`<div class="tally-row"><span>${esc(p.name)}</span><b>${tally[p.id]||0}</b></div>`).join('')}</div>`}
function showModFinish(){const g=state.game;modal.innerHTML=`<div class="dialog-head"><h2>Công bố kết quả</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><form id="modFinishForm"><label class="field"><span>Kết quả do quản trò xác nhận</span><input name="result" placeholder="Ví dụ: Phe Làng chiến thắng" maxlength="160" required></label><p class="hint">Chọn người thắng; có thể nhiều phe hoặc người thắng kèm. Máy không tự xét điều kiện của bộ vai hỗ trợ.</p><div class="pool-results">${g.players.map(p=>`<label class="pool-row"><input type="checkbox" name="winner" value="${p.id}"><span>${esc(p.name)}<small>${ROLES[p.role].name}</small></span></label>`).join('')}</div><div class="actions"><button class="primary" type="submit">Kết thúc & công khai toàn bộ vai</button></div></form>`;modal.showModal()}
function restoreModSnapshot(){const g=state.game,m=g.mod,snapshot=m.snapshots.pop();if(!snapshot)return false;const photos=new Map(g.players.map(p=>[p.id,p.photo]));g.players=snapshot.players.map(p=>({...structuredClone(p),photo:photos.get(p.id)||''}));g.round=snapshot.round;m.phase=snapshot.phase;m.records=structuredClone(snapshot.records);g.ballots=structuredClone(snapshot.ballots);m.pending=[...snapshot.pending];m.report=[...snapshot.report];g.lovers=[...snapshot.lovers];g.hunterTarget=snapshot.hunterTarget;g.hunterUsed=snapshot.hunterUsed;m.queue=[...snapshot.queue];m.step=snapshot.step;g.stage='moderator';g.votes={};addLog('Quản trò hoàn tác về '+snapshot.label+'.');save();return true}
// Catalog, local photos and moderator-assisted play controls.
modal.addEventListener('close',()=>{stopCamera();photoIndex=null;photoDraft=''});
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;const a=el.dataset.action,g=state.game;switch(a){
case 'dismiss-adjustment':state.setupAdjustment='';save();render();break;
case 'fill-villagers':{const gap=state.players.length-totalRoles();if(gap>0){rememberRoleSetup();state.roles.villager+=gap;state.preset='custom';save();render()}break}
case 'remove-with-role':if(removeSetupPlayer(Number(el.dataset.index),el.dataset.role)){modal.close();render()}break;

case 'picker-reset':resetRoleSearch();render();document.getElementById('roleSearch')?.focus();break;
case 'library-reset':resetRoleSearch(true);render();document.getElementById('librarySearch')?.focus();break;
case 'picker-clear':pickerQuery='';pickerLimit=20;render();document.getElementById('roleSearch')?.focus();break;
case 'library-more':libraryLimit+=24;document.getElementById('libraryResults').innerHTML=libraryCards();break;
case 'library-clear':libraryQuery='';libraryLimit=24;render();document.getElementById('librarySearch')?.focus();break;
case 'custom-pool':modal.close();customPoolModal();break;
case 'photo-open':photoIndex=Number(el.dataset.index);photoDraft=cleanPhoto(state.photos[photoIndex]);photoModal();break;
case 'photo-file':document.getElementById('photoFile').click();break;
case 'photo-native':document.getElementById('photoNative').click();break;
case 'photo-remove':photoDraft='';photoModal();break;
case 'photo-save':if(photoIndex!==null){const saved=setPlayerPhoto(photoIndex,photoDraft);modal.close();render();if(saved)toast('Đã lưu ảnh trên thiết bị.')}break;
case 'camera-start':await startCamera();break;
case 'camera-capture':try{const v=document.getElementById('cameraVideo');photoDraft=photoFromSource(v,v.videoWidth,v.videoHeight);photoModal()}catch(e){toast('Chờ camera sẵn sàng rồi chụp lại.')}break;
case 'camera-back':photoModal();break;
case 'mod-public':if(g?.manual){g.stage='mod-public';secret=false;save();render()}break;
case 'mod-private':if(g?.manual){g.stage='moderator';secret=false;render()}break;
case 'mod-player':if(g?.manual&&secret)showModPlayer(Number(el.dataset.id));break;
case 'mod-role-info':modal.close();showRoleInfo(el.dataset.role);break;
case 'mod-alive-confirm':{if(!g?.manual||!secret)break;const p=byId(Number(el.dataset.id));modal.close();confirmBox(p.alive?'Loại '+esc(p.name)+'?':'Hồi sinh '+esc(p.name)+'?',p.alive?'Quản trò đã kiểm tra bảo vệ, đổi phe, cái chết liên kết và điều kiện đặc biệt. Dấu Thợ săn được xử lý tự động nếu đã đặt.':'Người này sẽ được đưa lại vào danh sách sống. Quản trò tự kiểm tra vai và kỹ năng sau hồi sinh.','mod-alive-apply',p.alive?'Xác nhận loại':'Xác nhận hồi sinh');modPlayerId=p.id;break}
case 'mod-alive-apply':if(g?.manual&&secret){const p=byId(modPlayerId);modSetAlive(p.id,!p.alive);modal.close();render()}break;
case 'mod-next':if(g?.manual&&secret){const m=g.mod,k=m.queue[m.step];if(!k)break;modSnapshot();const target=m.draftTarget!=null&&m.draftTarget!==''?Number(m.draftTarget):null;if(k==='hunter'&&g.players.some(p=>p.alive&&p.role==='hunter')){if(target!==null&&byId(target)?.role==='hunter'){toast('Thợ săn chọn người khác.');break}g.hunterTarget=target}const entry=`Đêm ${g.round} · ${ROLES[k].name}: ${target!=null?byId(target)?.name+' · ':''}${m.draft||'không ghi hành động'}`;m.records.push(entry);addLog(entry);m.step++;m.draft='';m.draftTarget='';save();render()}break;
case 'mod-prev':if(g?.manual&&secret&&g.mod.step>0){g.mod.step--;g.mod.draft='';g.mod.draftTarget='';save();render()}break;
case 'mod-dawn':if(g?.manual&&secret){modal.innerHTML=`<div class="dialog-head"><h2>Thông báo bình minh</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><form id="modDawnForm"><label class="field"><span>Nội dung cả làng được xem</span><textarea name="report" rows="5" maxlength="1500">${esc(g.mod.pending.length?'Bị loại: '+g.mod.pending.map(id=>byId(id).name+(g.settings.revealDeath?' ('+ROLES[byId(id).role].name+')':'')).join(', ')+'.':'Không có ai bị loại đêm qua.')}</textarea></label><p class="hint">Quản trò sửa nội dung nếu có vai làm giả thông báo hoặc hiệu ứng che vai.</p><div class="actions"><button class="primary" type="submit">Bình minh · hiện màn hình chung</button></div></form>`;modal.showModal()}break;
case 'mod-night':if(g?.manual&&secret)confirmBox('Bắt đầu đêm kế tiếp?','Kiểm tra hết kỹ năng, phiếu và điều kiện thắng trước khi chuyển đêm.','mod-night-apply','Sang đêm kế tiếp');break;
case 'mod-night-apply':modal.close();startModeratorNight();break;
case 'mod-votes':if(g?.manual&&secret)showModVotes();break;
case 'mod-undo':if(g?.manual&&secret)confirmBox('Hoàn tác mốc gần nhất?','Phục hồi vai, trạng thái, điểm, phiếu và ghi nhận tại mốc đã lưu. Quản trò tự quyết định những chuyển phe nào cần giữ lại.','mod-undo-apply','Phục hồi mốc');break;
case 'mod-undo-apply':modal.close();restoreModSnapshot();render();break;
case 'mod-finish':if(g?.manual&&secret)showModFinish();break;
}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-role-search]')){pickerQuery=t.value;pickerLimit=20;document.getElementById('pickerResults').innerHTML=pickerRows()}if(t.matches('[data-library-search]')){libraryQuery=t.value;libraryLimit=24;document.getElementById('libraryResults').innerHTML=libraryCards()}if(t.matches('[data-house-rule]')){state.houseRules[t.dataset.houseRule]=t.value;save()}if(t.id==='poolSearch')document.getElementById('poolResults').innerHTML=poolRows(t.value);if(t.id==='modRoleSearch'){const select=document.getElementById('modRole'),current=select.value;select.innerHTML=modOptions(t.value,current)}if(t.id==='modNightNote'&&state.game?.manual){state.game.mod.draft=t.value;save()}});

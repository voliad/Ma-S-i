const DEFAULT={players:Array.from({length:8},(_,i)=>'Người chơi '+(i+1)),roles:{wolf:2,villager:3,seer:1,guard:1,witch:1,hunter:0,cupid:0,jester:0},preset:'classic',settings:{mode:'auto',minutes:3,revealDeath:false,voice:false},game:null};
function readStore(){try{const v=JSON.parse(localStorage.getItem('demlang-v1'));if(v&&Array.isArray(v.players)&&v.players.length>=5&&v.players.length<=24)return {...DEFAULT,...v,settings:{...DEFAULT.settings,...v.settings}}}catch(e){}return structuredClone(DEFAULT)}
let state=readStore(),page='play',secret=false,selected=[],nightResult=null,expanded=false,timerInterval=null,timerEnd=0,timerLeft=0,timerRunning=false;

function setup(){const n=state.players.length,t=totalRoles(),wolf=state.roles.wolf;return `<section class="hero"><div><div class="eyebrow">Một đêm xuống. Ngàn lời nghi ngờ.</div><h1>Ai là <em>Ma Sói?</em></h1><p>Một ngôi làng. Hai phe. Không ai đáng tin.<br>Tập hợp bạn bè và để cuộc săn bắt đầu.</p><div class="hero-tags"><span>✦ Chơi cùng nhau ngoài đời</span><span>5–24 người</span><span>Tiếng Việt</span></div></div><div class="hero-art">${art()}</div></section>${state.game?`<div class="resume"><div><p>Ngôi làng của bạn vẫn đang chờ.</p><small>Ván đã lưu · ${state.game.players.length} người · ${state.game.stage==='over'?'Đã kết thúc':'Ngày '+state.game.round}</small></div><button class="primary" data-action="resume">${state.game.stage==='over'?'Xem kết quả':'Tiếp tục ván'} →</button></div>`:''}<div class="workspace-head"><div><h2>Chuẩn bị ngôi làng</h2><p>Mọi cuộc săn đều bắt đầu bằng một bí mật.</p></div><div class="steps"><span class="active"><b>1</b> Thiết lập</span><span><b>2</b> Nhận vai</span><span><b>3</b> Vào làng</span></div></div><section class="setup-grid"><div class="panel"><div class="panel-head"><div class="panel-title"><span class="symbol">♙</span><h3>Người chơi</h3></div><span class="count-badge">${n} / 24</span></div><div class="panel-body"><div class="players-list">${state.players.map((p,i)=>`<div class="player-input"><span>${String(i+1).padStart(2,'0')}</span><input aria-label="Tên người chơi ${i+1}" data-name="${i}" value="${esc(p)}" maxlength="28"><button data-action="remove" data-index="${i}" aria-label="Xóa người chơi ${i+1}" ${n<=5?'disabled':''}>×</button></div>`).join('')}</div><button class="add-btn" data-action="add" ${n>=24?'disabled':''}>＋ Thêm người chơi</button><p class="hint">Đặt tên để cả làng dễ gọi nhau.<br><span class="gold">Quản trò riêng không tính vào danh sách.</span></p><hr class="panel-rule"><label class="mode-label" for="mode">Ai sẽ dẫn ván chơi?</label><div class="segmented"><button data-action="mode" data-value="auto" class="${state.settings.mode==='auto'?'selected':''}">◉ Máy dẫn lượt</button><button data-action="mode" data-value="moderator" class="${state.settings.mode==='moderator'?'selected':''}">♙ Có quản trò</button></div><p class="hint">${state.settings.mode==='auto'?'Mọi người đều được chơi. Vai được gọi tự cầm máy để thực hiện kỹ năng.':'Một người ngoài danh sách giữ máy, xem vai và điều khiển ván.'}</p></div></div><div class="panel"><div class="panel-head"><div class="panel-title"><span class="symbol">♧</span><h3>Bộ vai</h3></div><button class="text-btn" data-page="roles">Xem sổ vai ↗</button></div><div class="panel-body"><div class="segmented"><button data-action="preset" data-value="classic" class="${state.preset==='classic'?'selected':''}">Cổ điển</button><button data-action="preset" data-value="special" class="${state.preset==='special'?'selected':''}">Nhiều bất ngờ</button><button data-action="preset" data-value="custom" class="${state.preset==='custom'?'selected':''}">Tùy chỉnh</button></div><div class="role-list">${Object.entries(ROLES).filter(([k])=>expanded||['wolf','villager','seer','guard','witch'].includes(k)||state.roles[k]>0).map(([k,r])=>`<div class="role-row ${k}"><div class="role-symbol">${icon(k)}</div><div class="role-info"><b>${r.name}</b><p>${r.short}</p></div><div class="stepper"><button data-action="role" data-role="${k}" data-delta="-1" aria-label="Giảm ${r.name}" ${state.roles[k]<=0?'disabled':''}>−</button><span>${state.roles[k]}</span><button data-action="role" data-role="${k}" data-delta="1" aria-label="Thêm ${r.name}" ${state.roles[k]>=(['wolf','villager'].includes(k)?24:1)?'disabled':''}>+</button></div></div>`).join('')}</div><div class="more-roles"><button class="text-btn" data-action="expand">${expanded?'− Thu gọn':'＋ Thêm vai đặc biệt'}</button><span class="subtle">${t} / ${n} vai</span></div></div></div><aside class="panel summary"><div><div class="summary-label">NGÔI LÀNG ĐÊM NAY</div><div class="summary-number">${n}<small>người chơi</small></div><div class="balance"><span style="width:${Math.max(1,wolf)/Math.max(1,t)*100}%;background:#9b6d5c"></span><span style="flex:1;background:#80906f"></span>${state.roles.jester?'<span style="width:10%;background:#b3a273"></span>':''}</div><div class="balance-key"><span>● <b>${wolf}</b> Sói</span><span>● <b>${t-wolf-state.roles.jester}</b> Làng${state.roles.jester?' · 1 riêng':''}</span></div><hr class="summary-rule"><div class="setting-line"><span>Thảo luận mỗi ngày</span><b>${state.settings.minutes} phút</b></div><div class="setting-line"><span>Lộ vai khi bị loại</span><b>${state.settings.revealDeath?'Có':'Không'}</b></div><div class="setting-line"><span>Đọc lời dẫn</span><b>${state.settings.voice?'Bật':'Tắt'}</b></div><button class="text-btn" data-action="settings">Tùy chỉnh luật chơi ↗</button></div><div>${t!==n?`<p class="error">Cần đúng ${n} vai. Hiện ${t>n?'thừa':'thiếu'} ${Math.abs(t-n)} vai.</p>`:wolf<1?'<p class="error">Ngôi làng cần ít nhất 1 Ma sói.</p>':wolf>=n/2?'<p class="error">Số Sói phải ít hơn một nửa số người.</p>':'<p class="hint" style="text-align:left">✧ Bộ vai đã sẵn sàng.</p>'}<button class="primary start" data-action="start" ${t!==n||wolf<1||wolf>=n/2?'disabled':''}><span>Chia vai & bắt đầu</span><span>→</span></button><p class="hint">Mỗi người chỉ được biết vai của mình.</p></div></aside></section><div class="intro-note"><span>Chỉ cần một chiếc điện thoại. Không cần bộ bài.</span><span>Vai được xáo ngẫu nhiên cho mỗi ván.</span></div>`}
function library(){return `<div class="page-heading"><div class="eyebrow">Hiểu vai. Giấu mặt.</div><h1>Sổ vai của ngôi làng</h1><p>8 vai, 3 phe và vô số cách để nghi ngờ nhau. Đây là luật riêng được áp dụng trong Đêm Làng.</p></div><section class="library">${Object.entries(ROLES).map(([k,r])=>`<article class="role-card"><div class="role-symbol">${icon(k)}</div><div class="faction">${r.team}</div><h2>${r.name}</h2><p>${r.desc}</p></article>`).join('')}</section><button class="secondary" data-page="play">← Về bàn chơi</button>`}
function rules(){return `<div class="page-heading"><div class="eyebrow">Bạn bè ngoài đời. Đối thủ trong làng.</div><h1>Luật của màn đêm</h1><p>Chơi trực tiếp cùng 5–24 người trên một thiết bị. Bản này lấy cảm hứng từ cách chia vai chuyền máy của Wolvesville Classic, với giao diện và luật được xây dựng riêng.</p></div><section class="rules-grid"><article><h2>Một ván chơi diễn ra thế nào?</h2><ol><li><strong>Chuẩn bị:</strong> nhập tên người chơi, chọn bộ vai. Quản trò riêng không tham gia nhận vai.</li><li><strong>Nhận vai:</strong> chuyền máy theo tên. Chỉ mở vai khi đã cầm máy một mình; ẩn vai trước khi đưa cho người tiếp theo.</li><li><strong>Đêm:</strong> mọi người nhắm mắt. Chỉ vai được gọi mở mắt và cầm máy. Lần lượt: Cupid (đêm đầu), đôi tình nhân (đêm đầu), Bảo vệ, Sói, Tiên tri, Phù thủy. Không đọc tên hay kết quả kỹ năng ra tiếng.</li><li><strong>Bình minh:</strong> máy xử lý các hành động và công bố người bị loại. Thợ săn bắn ngay khi bị loại.</li><li><strong>Ban ngày:</strong> thảo luận, biện hộ rồi giơ tay bỏ phiếu. Nhập số phiếu vào máy; mỗi người còn sống có tối đa một phiếu. Hòa phiếu hoặc tất cả bỏ qua thì không treo ai.</li><li><strong>Lặp lại:</strong> đêm và ngày tiếp diễn cho đến khi một phe thắng. Cuối ván mới mở toàn bộ vai.</li></ol></article><article><h2>Điều kiện thắng</h2><p class="reduced"><strong>Phe Làng:</strong> không còn Sói sống.<br><br><strong>Phe Sói:</strong> số Sói sống bằng hoặc nhiều hơn những người còn lại.<br><br><strong>Chán đời:</strong> thắng ngay nếu bị treo cổ ban ngày.<br><br><strong>Đôi tình nhân khác phe:</strong> nếu cả hai còn sống, họ ngăn kết thúc theo phe thông thường và chỉ thắng khi là hai người cuối cùng. Nếu một người chết, người kia chết theo.</p><hr class="panel-rule"><h2>Chơi kín & chơi offline</h2><p class="reduced">Giữ màn hình khỏi tầm nhìn người khác. Khi đổi ứng dụng hoặc tải lại trang, vai bí mật sẽ được che. Không mở công cụ trình duyệt trên máy chơi vì dữ liệu ván được lưu tại thiết bị.<br><br>Tải bản HTML qua nút cuối trang và mở file đó bằng trình duyệt để chơi hoàn toàn không cần mạng. Trang web cũng lưu bộ nhớ đệm khi trình duyệt cho phép; bản HTML là cách chắc chắn hơn.<br><br>Giọng đọc phụ thuộc tiếng Việt trên thiết bị và có thể cần mạng. Lời dẫn dạng chữ luôn dùng được offline.</p><a class="text-btn" href="https://play.google.com/store/apps/details?id=org.faudroids.werewolf" target="_blank" rel="noopener noreferrer">Trò chơi tham khảo ↗</a></article></section>`}
function render(){document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('active',el.dataset.page===page||page==='game'&&el.dataset.page==='play'));app.innerHTML=page==='play'?setup():page==='roles'?library():page==='rules'?rules():gameView();document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
function settings(){modal.innerHTML=`<div class="dialog-head"><h2>Luật của ngôi làng</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><form id="settingsForm"><label class="field"><span>Người dẫn ván</span><select name="mode"><option value="auto" ${state.settings.mode==='auto'?'selected':''}>Máy dẫn lượt — ai cũng được chơi</option><option value="moderator" ${state.settings.mode==='moderator'?'selected':''}>Có quản trò riêng</option></select><small>Áp dụng cho ván mới. Máy dẫn bằng chữ; có thể bật giọng đọc bên dưới.</small></label><label class="field"><span>Thảo luận mỗi ngày</span><select name="minutes">${[1,2,3,4,5,7,10].map(n=>`<option value="${n}" ${state.settings.minutes===n?'selected':''}>${n} phút</option>`).join('')}</select></label><label class="check"><input type="checkbox" name="revealDeath" ${state.settings.revealDeath?'checked':''}><span>Lộ vai khi bị loại<small>Mặc định tắt để giữ bí mật cho đến hết ván.</small></span></label><label class="check"><input type="checkbox" name="voice" ${state.settings.voice?'checked':''}><span>Đọc lời dẫn ban đêm<small>Chỉ đọc lời gọi chung. Giọng tiếng Việt phụ thuộc thiết bị; có thể cần mạng.</small></span></label><p class="hint">Bảo vệ không chọn cùng người hai đêm liên tiếp. Phù thủy được tự cứu. Hòa phiếu không treo ai. Sói thắng khi cân bằng quân số, trừ khi đôi tình nhân khác phe còn sống.</p><div class="actions"><button class="primary" type="submit">Lưu thiết lập</button></div></form>`;modal.showModal()}
function confirmBox(title,body,action,label='Xác nhận'){modal.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><p class="reduced">${body}</p><div class="actions"><button class="secondary" data-action="close">Quay lại</button><button class="primary" data-action="${action}">${label}</button></div>`;modal.showModal()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const limit=4294967296-(4294967296%(i+1));let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=limit);const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){const names=state.players.map(x=>x.trim());if(names.some(x=>!x))return toast('Điền tên cho tất cả người chơi.');if(new Set(names.map(x=>x.toLocaleLowerCase('vi'))).size!==names.length)return toast('Mỗi người cần một tên khác nhau.');if(totalRoles()!==names.length||state.roles.wolf<1||state.roles.wolf>=names.length/2)return;const deck=shuffle(Object.entries(state.roles).flatMap(([k,n])=>Array(n).fill(k)));state.game={players:names.map((name,i)=>({id:i,name,role:deck[i],alive:true})),settings:{...state.settings},stage:'deal',dealIndex:0,round:1,queue:[],nightIndex:0,night:{},lovers:[],lastGuard:null,healUsed:false,poisonUsed:false,hunterUsed:false,hunters:[],afterHunter:'dawn',log:[],dawn:[],votes:{},winner:null};page='game';secret=false;selected=[];save();render();window.scrollTo(0,0)}
function addLog(s){state.game.log.push(s)}
function beginNight(){stopTimer();const g=state.game;g.stage='night';g.night={};g.nightIndex=0;g.queue=[];if(g.round===1&&alive().some(p=>p.role==='cupid'))g.queue.push('cupid','lovers');for(const r of ['guard','wolf','seer','witch'])if(g.players.some(p=>p.role===r))g.queue.push(r);secret=false;selected=[];nightResult=null;g.votes={};addLog('Đêm '+g.round+' bắt đầu.');save();render()}
function speak(s){if(!state.game?.settings.voice||!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices(),v=voices.find(x=>x.lang.startsWith('vi'));if(!v){toast('Thiết bị chưa có giọng tiếng Việt. Hãy đọc lời dẫn trên màn hình.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='vi-VN';u.voice=v;u.rate=.85;speechSynthesis.speak(u)}
function nextNight(){const g=state.game;g.nightIndex++;window.scrollTo(0,0);secret=false;selected=[];nightResult=null;if('speechSynthesis'in window)speechSynthesis.cancel();if(g.nightIndex>=g.queue.length)resolveNight();else{save();render()}}
function eliminate(ids,cause){const g=state.game,newDead=[];const pending=[...new Set(ids)].filter(x=>x!==null&&x!==undefined);while(pending.length){const id=pending.shift(),p=byId(id);if(!p||!p.alive)continue;p.alive=false;newDead.push(id);addLog(p.name+' bị loại ('+cause+').');if(g.lovers.includes(id)){const mate=g.lovers.find(x=>x!==id);if(byId(mate)?.alive){pending.push(mate);addLog(byId(mate).name+' mất người yêu.')}}if(p.role==='hunter'&&!g.hunterUsed&&!g.hunters.includes(id))g.hunters.push(id)}return newDead}
function resolveNight(){const g=state.game,n=g.night;g.lastGuard=n.guard??null;let deaths=[];if(n.wolf!=null&&n.wolf!==n.guard&&!n.heal)deaths.push(n.wolf);if(n.poison!=null)deaths.push(n.poison);g.dawn=eliminate(deaths,'đêm '+g.round);g.afterHunter='dawn';g.stage=g.hunters.length?'hunter':'dawn';secret=false;save();render()}
function winner(){const g=state.game,ps=alive(),wolves=ps.filter(p=>p.role==='wolf').length;const pair=g.lovers.map(byId);const mixed=pair.length===2&&pair.every(p=>p.alive)&&((pair[0].role==='wolf')!==(pair[1].role==='wolf'));if(mixed)return ps.length===2?'lovers':null;if(!wolves)return 'village';if(wolves>=ps.length-wolves)return 'wolves';return null}
function checkWin(){const w=winner();if(!w)return false;state.game.winner=w;state.game.stage='over';stopTimer();save();return true}
function afterHunter(){const g=state.game;secret=false;selected=[];if(g.hunters.length)g.stage='hunter';else if(g.afterHunter==='dawn')g.stage='dawn';else if(!checkWin()){g.round++;beginNight();return}save();render()}
function targetGrid(players,multiple=false){return `<div class="player-grid">${players.map(p=>`<button class="target ${selected.includes(p.id)?'chosen':''}" data-action="target" data-id="${p.id}" ${multiple?'data-multiple="true"':''}><span class="avatar">${p.id+1}</span><span>${esc(p.name)}</span></button>`).join('')}</div>`}
function gate(title,text,button='Tôi đã cầm máy'){return `<span class="large-symbol">${icon('moon')}</span><div class="eyebrow">Mọi người khác hãy nhắm mắt</div><h1>${title}</h1><p>${text}</p><button class="primary" data-action="unlock">${button} →</button>`}
function gameView(){const g=state.game;if(!g){page='play';return setup()}const head=`<div class="game-wrap"><div class="game-top"><p>✦ ${g.stage==='deal'?'CHIA VAI BÍ MẬT':g.stage==='over'?'KẾT THÚC VÁN':'ĐÊM LÀNG · VÒNG '+g.round}</p><div style="display:flex;gap:16px"><button class="text-btn" data-action="veil">◈ Che màn hình</button><button class="text-btn" data-action="exit">Về bàn chơi</button></div></div><section class="game-stage">`;let body='';
 if(g.stage==='deal'){const p=g.players[g.dealIndex],r=ROLES[p.role];body=secret?`<div class="eyebrow">Chỉ ${esc(p.name)} được xem</div><div class="role-reveal"><span class="large-symbol">${icon(p.role)}</span><div class="faction">${r.team}</div><h2>${r.name}</h2><p>${r.desc}</p></div><button class="primary" data-action="deal-next">Ẩn vai & ${g.dealIndex===g.players.length-1?'vào làng':'chuyền máy'} →</button>`:`<span class="large-symbol">${icon('lock')}</span><div class="eyebrow">Người chơi ${g.dealIndex+1} / ${g.players.length}</div><h1>${esc(p.name)}</h1><p>Hãy nhận máy, đảm bảo không ai nhìn màn hình.<br>Vai của bạn đang chờ phía sau.</p><button class="primary" data-action="unlock">Xem vai của tôi</button><div class="progress"><div style="width:${g.dealIndex/g.players.length*100}%"></div></div>`}
 else if(g.stage==='ready'){body=`<span class="large-symbol">${icon('moon')}</span><div class="eyebrow">Tất cả đã nhận vai</div><h1>Ngôi làng chìm vào giấc ngủ.</h1><p>${g.settings.mode==='moderator'?'Đưa máy cho quản trò. Quản trò không nằm trong danh sách người chơi và sẽ điều khiển các lượt.':'Đặt máy ở giữa. Mọi người nhắm mắt. Khi được gọi, vai đó mở mắt và cầm máy thực hiện kỹ năng. Nhớ ẩn màn hình trước khi đặt xuống.'}</p><p class="hint">Máy dẫn lượt bằng chữ${g.settings.voice?' và giọng đọc trên thiết bị':''}. Sau mỗi lượt, bấm gọi vai tiếp theo; người bấm chỉ nhìn màn hình lời gọi chung.</p><button class="primary" data-action="begin-night">Bắt đầu đêm đầu tiên →</button>`}
 else if(g.stage==='night')body=nightView();
 else if(g.stage==='dawn'){body=`<span class="large-symbol">${icon('sun')}</span><div class="eyebrow">Bình minh · Ngày ${g.round}</div><h1>${g.dawn.length?'Đêm qua, làng mất đi…':'Một đêm bình yên.'}</h1><p>${g.dawn.length?g.dawn.map(id=>{const p=byId(id);return '<strong>'+esc(p.name)+'</strong>'+(g.settings.revealDeath?' — '+ROLES[p.role].name:'')}).join('<br>'):'Không có ai bị loại đêm qua. Nhưng Sói vẫn đang ở đây.'}</p><button class="primary" data-action="day">Cả làng thức dậy →</button>`}
 else if(g.stage==='day'){body=`<div class="eyebrow">Ngày ${g.round} · ${alive().length} người còn sống</div><h1>Đã đến lúc nghi ngờ.</h1><p>Ai đang nói thật? Ai giấu đôi nanh sau nụ cười?<br>Thảo luận cùng nhau trước khi đưa ra lá phiếu.</p><div class="timer" id="timer">${formatTime(timerRunning?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerLeft)}</div><div class="actions"><button class="secondary" data-action="timer">${timerRunning?'Tạm dừng':'Bắt đầu đếm giờ'}</button><button class="text-btn" data-action="timer-reset">↻ Đặt lại</button></div><div class="alive-strip">${alive().map(p=>`<span>${esc(p.name)}</span>`).join('')}</div><button class="primary" data-action="vote">Đến lượt bỏ phiếu →</button>`}
 else if(g.stage==='vote')body=voteView();
 else if(g.stage==='hunter'){const p=byId(g.hunters[0]);body=!secret?gate('Thợ săn, phát súng cuối cùng.',`${esc(p.name)} đã bị loại. Người này cầm máy và chọn một người để bắn, hoặc bỏ qua.`):`<div class="eyebrow">Thợ săn · ${esc(p.name)}</div><h1>Bạn chọn ai đi cùng?</h1><p>Phát súng bỏ qua mọi lớp bảo vệ.</p>${targetGrid(alive())}<div class="actions"><button class="secondary" data-action="hunter-skip">Không bắn</button><button class="primary" data-action="hunter-fire" ${selected.length!==1?'disabled':''}>Bắn & ẩn màn hình</button></div>`}
 else if(g.stage==='over'){const labels={village:['villager','Phe Làng chiến thắng.','Ngôi làng đã thoát khỏi những chiếc nanh.'],wolves:['wolf','Phe Sói chiến thắng.','Màn đêm đã nuốt chửng ngôi làng.'],lovers:['cupid','Tình yêu chiến thắng.','Hai người cuối cùng, vượt qua mọi phe phái.'],jester:['jester','Chán đời chiến thắng.','Cả làng đã treo đúng người muốn bị treo.']},v=labels[g.winner];body=`<span class="large-symbol">${icon(v[0])}</span><div class="eyebrow">Mọi bí mật được hé lộ</div><h1>${v[1]}</h1><p>${v[2]}</p><div class="results-list">${g.players.map(p=>`<div><span class="role-symbol">${icon(p.role)}</span><span><b>${esc(p.name)}</b><small>${ROLES[p.role].name} · ${p.alive?'Còn sống':'Đã bị loại'}${g.lovers.includes(p.id)?' · ♥':''}</small></span></div>`).join('')}</div><details class="log"><summary>Nhật ký ván chơi</summary><ol>${g.log.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details><div class="actions"><button class="secondary" data-action="exit">Về bàn chơi</button><button class="primary" data-action="replay">Chơi lại cùng nhóm →</button></div>`}
 if(g.settings.mode==='moderator'&&!['deal','ready','over'].includes(g.stage))body+='<div class="actions"><button class="text-btn" data-action="moderator">♙ Sổ bí mật của quản trò</button></div>';
 return head+body+'</section><p class="hint" style="text-align:center">'+(g.stage==='over'?'Cảm ơn vì đã sống sót. Hoặc đã nói dối rất giỏi.':'◇ Ván được lưu trên thiết bị này. Che màn hình trước khi chuyền máy.')+'</p></div>'}
function nightView(){const g=state.game,r=g.queue[g.nightIndex],role=ROLES[r],performer=alive().find(p=>p.role===r),titles={cupid:'Cupid, hãy thức dậy.',lovers:'Đôi tình nhân, hãy thức dậy.',guard:'Bảo vệ, hãy thức dậy.',wolf:'Ma sói, hãy thức dậy.',seer:'Tiên tri, hãy thức dậy.',witch:'Phù thủy, hãy thức dậy.'};
 if(!secret)return gate(titles[r],r==='lovers'?'Chỉ hai người vừa được Cupid báo hiệu mở mắt cùng nhau và xem người yêu. Nếu chơi không quản trò, Cupid nhớ vị trí hai người và chạm nhẹ để báo hiệu khi mọi người nhắm mắt.':'Chỉ vai được gọi mở mắt và cầm máy. Khi hoàn tất, ẩn màn hình rồi đặt máy về giữa bàn. Nếu vai đã bị loại, chờ vài giây rồi bấm tiếp tục.','Mở lượt bí mật');
 if(r==='lovers')return `<div class="eyebrow">Bí mật của hai người</div><span class="large-symbol">${icon('cupid')}</span><h1>${g.lovers.map(id=>esc(byId(id).name)).join(' & ')}</h1><p>Hai bạn là đôi tình nhân. Một người bị loại, người kia cũng bị loại.<br>${g.lovers.length===2&&((byId(g.lovers[0]).role==='wolf')!==(byId(g.lovers[1]).role==='wolf'))?'Hai bạn khác phe: chỉ thắng khi là hai người cuối cùng.':'Hai bạn cùng phe: thắng cùng phe của mình.'}</p><button class="primary" data-action="night-next">Đã nhớ · Ẩn & ngủ lại →</button>`;
 if(r!=='wolf'&&!performer)return `<span class="large-symbol">${icon('moon')}</span><h1>Không có hành động.</h1><p>Vai này đã bị loại. Giữ nhịp lượt như bình thường rồi chuyển tiếp.</p><button class="primary" data-action="night-next">Ẩn & chuyển lượt →</button>`;
 if(r==='seer'&&nightResult!==null)return `<span class="large-symbol">${icon('seer')}</span><div class="eyebrow">Chỉ Tiên tri được xem</div><h1>${esc(byId(nightResult).name)}</h1><div class="role-reveal"><h2>${byId(nightResult).role==='wolf'?'Là Ma sói.':'Không phải Ma sói.'}</h2></div><p>Ghi nhớ kết quả, giữ bí mật và quay về giấc ngủ.</p><button class="primary" data-action="seer-done">Ẩn kết quả & ngủ lại →</button>`;
 if(r==='witch'){const victim=g.night.wolf!=null?byId(g.night.wolf):null;return `<div class="eyebrow">Lượt bí mật · Phù thủy</div><h1>Hai bình thuốc. Hai lựa chọn.</h1><p>${victim?'Sói chọn tấn công <strong>'+esc(victim.name)+'</strong>.':'Sói không tấn công ai.'} Bạn không biết Bảo vệ đã chọn ai.</p><label class="check" style="justify-content:center"><input id="healChoice" type="checkbox" ${g.healUsed||!victim?'disabled':''} ${g.night.heal?'checked':''}><span>${g.healUsed?'Bình cứu đã dùng':victim?'Dùng bình cứu để cứu '+esc(victim.name):'Không có mục tiêu để cứu'}</span></label><hr class="panel-rule"><p>${g.poisonUsed?'Bình độc đã dùng.':'Tùy chọn: chọn một người để dùng bình độc. Để trống nếu muốn giữ lại.'}</p>${g.poisonUsed?'':targetGrid(alive().filter(p=>p.id!==performer.id))}<div class="actions"><button class="primary" data-action="witch-done">Xác nhận & ẩn màn hình →</button></div>`}
 const candidates=r==='wolf'?alive().filter(p=>p.role!=='wolf'):r==='guard'?alive().filter(p=>p.id!==g.lastGuard):r==='seer'?alive().filter(p=>p.id!==performer.id):alive();
 const descriptions={cupid:'Chọn đúng hai người. Có thể chọn chính mình. Sau đó bí mật báo hiệu cho hai người khi cả làng nhắm mắt.',guard:'Chọn một người để chặn tấn công của Sói. Có thể tự bảo vệ; không chọn lại người của đêm trước.',wolf:'Các Sói cùng thống nhất một nạn nhân. Chỉ một Sói thao tác trên máy.',seer:'Chọn một người khác để biết người đó có phải Ma sói hay không.'};
 return `<div class="eyebrow">Lượt bí mật · ${role.name}</div><span class="large-symbol" style="width:48px;height:54px">${icon(r)}</span><h1>${r==='cupid'?'Ghép một đôi tình nhân.':r==='wolf'?'Đêm nay, chọn ai?':r==='guard'?'Bạn sẽ bảo vệ ai?':'Bạn muốn soi ai?'}</h1><p>${descriptions[r]}</p>${targetGrid(candidates,r==='cupid')}<div class="actions">${['guard','wolf','seer'].includes(r)?'<button class="secondary" data-action="night-skip">Bỏ qua kỹ năng</button>':''}<button class="primary" data-action="night-confirm" ${selected.length!==(r==='cupid'?2:1)?'disabled':''}>${r==='seer'?'Xem kết quả':'Xác nhận & ẩn màn hình'} →</button></div>`;
}
function voteView(){const g=state.game,cast=Object.values(g.votes).reduce((a,b)=>a+b,0);return `<div class="eyebrow">Bỏ phiếu · Ngày ${g.round}</div><h1>Ai sẽ rời ngôi làng?</h1><p>Cả nhóm giơ tay bỏ phiếu ngoài đời. Nhập tổng số phiếu từng người nhận được. Mỗi người còn sống có tối đa một phiếu; số chưa nhập được tính là bỏ qua.</p><div>${alive().map(p=>`<div class="vote-row"><span class="avatar">${p.id+1}</span><span class="name">${esc(p.name)}</span><div class="stepper"><button data-action="vote-count" data-id="${p.id}" data-delta="-1" aria-label="Giảm phiếu cho ${esc(p.name)}" ${!(g.votes[p.id]>0)?'disabled':''}>−</button><span>${g.votes[p.id]||0}</span><button data-action="vote-count" data-id="${p.id}" data-delta="1" aria-label="Thêm phiếu cho ${esc(p.name)}" ${cast>=alive().length?'disabled':''}>+</button></div></div>`).join('')}</div><p class="hint">${cast} / ${alive().length} phiếu · ${alive().length-cast} bỏ qua · Hòa phiếu: không treo ai.</p><div class="actions"><button class="secondary" data-action="back-day">← Thảo luận tiếp</button><button class="primary" data-action="vote-confirm">Chốt phiếu →</button></div>`}
function voteOutcome(){const g=state.game,v=alive().map(p=>({id:p.id,votes:g.votes[p.id]||0})),max=Math.max(...v.map(x=>x.votes)),top=v.filter(x=>x.votes===max);return max>0&&top.length===1?top[0].id:null}
function resolveVote(){const g=state.game,id=voteOutcome();if(id!=null){const p=byId(id);if(p.role==='jester'){p.alive=false;g.winner='jester';g.stage='over';addLog(p.name+' (Chán đời) bị treo cổ và thắng riêng.');save();render();return}const dead=eliminate([id],'bỏ phiếu ngày '+g.round);g.dawn=[];g.afterHunter='vote';if(g.hunters.length){g.stage='hunter';secret=false;selected=[];save();render();return}toast(dead.map(x=>byId(x).name).join(', ')+' bị loại.')}else addLog('Ngày '+g.round+': hòa phiếu hoặc không có phiếu. Không ai bị treo.');if(!checkWin()){g.round++;beginNight()}else render()}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopTimer(){if(timerRunning)timerLeft=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerInterval)}
function toggleTimer(){if(timerRunning)stopTimer();else{if(timerLeft<=0)timerLeft=state.game.settings.minutes*60;timerEnd=Date.now()+timerLeft*1000;timerRunning=true;timerInterval=setInterval(()=>{const t=Math.max(0,Math.ceil((timerEnd-Date.now())/1000)),el=document.getElementById('timer');if(el)el.textContent=formatTime(t);if(t===0){stopTimer();toast('Hết giờ thảo luận. Đến lượt bỏ phiếu!');if(page==='game')render()}},300)}render()}
function downloadOffline(){fetch('./Ma-Soi-Dem-Lang-Offline.html').then(r=>{if(!r.ok)throw Error();return r.blob()}).then(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ma-Soi-Dem-Lang-Offline.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã tải bản HTML. Mở file bằng trình duyệt để chơi offline.');}).catch(()=>toast('Chưa tải được bản offline. Hãy kết nối mạng và thử lại.'))}
function moderatorBook(){modal.innerHTML=`<div class="dialog-head"><h2>Sổ quản trò · Bí mật</h2><button class="close" data-action="close" aria-label="Đóng">×</button></div><p class="hint">Chỉ quản trò được xem. Đóng sổ trước khi đưa máy cho người chơi.</p><div class="results-list">${state.game.players.map(p=>`<div><span class="role-symbol">${icon(p.role)}</span><span><b>${esc(p.name)}</b><small>${ROLES[p.role].name} · ${p.alive?'Còn sống':'Đã bị loại'}${state.game.lovers.includes(p.id)?' · ♥':''}</small></span></div>`).join('')}</div>`;modal.showModal()}
function veil(){secret=false;selected=[];nightResult=null;if(modal.open)modal.close();if('speechSynthesis'in window)speechSynthesis.cancel();if(page==='game')render()}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.matches('.brand')){e.preventDefault();page='play';veil();render();window.scrollTo(0,0);return}if(el.dataset.page){secret=false;selected=[];nightResult=null;page=el.dataset.page;render();window.scrollTo(0,0);return}const a=el.dataset.action,g=state.game;switch(a){case 'add':if(state.players.length<24){let label=state.players.length+1;while(state.players.includes('Người chơi '+label))label++;state.players.push('Người chơi '+label);if(state.preset!=='custom')applyPreset(state.preset);else{state.roles.villager++;save()}render()}break;case 'remove':if(state.players.length>5){state.players.splice(Number(el.dataset.index),1);if(state.preset!=='custom')applyPreset(state.preset);else{state.roles.villager=Math.max(0,state.roles.villager-1);save()}render()}break;case 'role':{const k=el.dataset.role,max=['wolf','villager'].includes(k)?24:1;state.roles[k]=Math.max(0,Math.min(max,state.roles[k]+Number(el.dataset.delta)));state.preset='custom';save();render();break}case 'preset':if(el.dataset.value!=='custom')applyPreset(el.dataset.value);else{state.preset='custom';save()}render();break;case 'mode':state.settings.mode=el.dataset.value;save();render();break;case 'expand':expanded=!expanded;render();break;case 'settings':settings();break;case 'close':modal.close();break;case 'start':if(g&&g.stage!=='over')confirmBox('Bắt đầu ván mới?','Ván đang chơi sẽ được thay bằng ván mới.','start-confirm','Chia vai ván mới');else newGame();break;case 'start-confirm':modal.close();newGame();break;case 'resume':page='game';veil();if(g.stage==='day'&&timerLeft===0)timerLeft=g.settings.minutes*60;render();window.scrollTo(0,0);break;case 'exit':secret=false;selected=[];nightResult=null;page='play';render();window.scrollTo(0,0);break;case 'replay':newGame();break;case 'unlock':secret=true;selected=[];nightResult=null;render();break;case 'deal-next':secret=false;g.dealIndex++;if(g.dealIndex>=g.players.length)g.stage='ready';save();render();break;case 'begin-night':beginNight();speak('Cả làng đi ngủ. '+(ROLES[g.queue[0]]?.name||'Đôi tình nhân')+', hãy thức dậy.');break;case 'veil':veil();break;case 'target':{const id=Number(el.dataset.id);if(el.dataset.multiple){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<2)selected.push(id);else toast('Chỉ chọn hai người. Bấm vào người đã chọn để bỏ chọn.')}else selected=selected.includes(id)?[]:[id];render();break}case 'night-next':nextNight();if(g.stage==='night')speak((ROLES[g.queue[g.nightIndex]]?.name||'Đôi tình nhân')+', hãy thức dậy.');break;case 'night-skip':addLog('Đêm '+g.round+': '+ROLES[g.queue[g.nightIndex]].name+' bỏ qua kỹ năng.');nextNight();if(g.stage==='night')speak((ROLES[g.queue[g.nightIndex]]?.name||'Đôi tình nhân')+', hãy thức dậy.');break;case 'night-confirm':{const r=g.queue[g.nightIndex];if(selected.length!==(r==='cupid'?2:1))break;if(r==='seer'){nightResult=selected[0];render();break}if(r==='cupid'){g.lovers=[...selected];addLog('Cupid ghép '+selected.map(x=>byId(x).name).join(' và ')+'.')}else{g.night[r]=selected[0];addLog('Đêm '+g.round+': '+ROLES[r].name+' chọn '+byId(selected[0]).name+'.')}nextNight();if(g.stage==='night')speak((ROLES[g.queue[g.nightIndex]]?.name||'Đôi tình nhân')+', hãy thức dậy.');break}case 'seer-done':addLog('Đêm '+g.round+': Tiên tri soi '+byId(nightResult).name+' — '+(byId(nightResult).role==='wolf'?'là Sói.':'không phải Sói.'));nextNight();if(g.stage==='night')speak((ROLES[g.queue[g.nightIndex]]?.name||'Đôi tình nhân')+', hãy thức dậy.');break;case 'witch-done':{const heal=document.getElementById('healChoice')?.checked;if(heal&&!g.healUsed&&g.night.wolf!=null){g.night.heal=true;g.healUsed=true;addLog('Đêm '+g.round+': Phù thủy dùng bình cứu.')}if(selected.length&&!g.poisonUsed){g.night.poison=selected[0];g.poisonUsed=true;addLog('Đêm '+g.round+': Phù thủy đầu độc '+byId(selected[0]).name+'.')}nextNight();break}case 'day':if(!checkWin()){g.stage='day';timerLeft=g.settings.minutes*60;save()}render();break;case 'timer':toggleTimer();break;case 'timer-reset':stopTimer();timerLeft=g.settings.minutes*60;render();break;case 'vote':stopTimer();g.stage='vote';save();render();break;case 'back-day':g.stage='day';save();render();break;case 'vote-count':{const id=el.dataset.id,delta=Number(el.dataset.delta),sum=Object.values(g.votes).reduce((a,b)=>a+b,0);if(delta>0&&sum>=alive().length)break;g.votes[id]=Math.max(0,(g.votes[id]||0)+delta);save();render();break}case 'vote-confirm':{const id=voteOutcome();confirmBox('Chốt quyết định của làng?',id==null?'Hòa phiếu hoặc không có phiếu. Không ai bị treo cổ.':esc(byId(id).name)+' nhận nhiều phiếu nhất và sẽ bị treo cổ.','vote-resolve','Chốt kết quả');break}case 'vote-resolve':modal.close();resolveVote();break;case 'hunter-fire':if(selected.length!==1)break;{const dead=eliminate([selected[0]],'phát súng Thợ săn');g.dawn.push(...dead);g.hunterUsed=true;g.hunters.shift();toast(dead.map(x=>byId(x).name).join(', ')+' bị loại.');afterHunter();break}case 'hunter-skip':g.hunterUsed=true;g.hunters.shift();addLog('Thợ săn bỏ qua phát súng.');afterHunter();break;case 'moderator':confirmBox('Chỉ dành cho quản trò','Màn hình tiếp theo sẽ hiển thị toàn bộ vai. Đảm bảo không có người chơi nhìn thấy.','moderator-open','Tôi là quản trò');break;case 'moderator-open':modal.close();moderatorBook();break;}});
document.addEventListener('input',e=>{if(e.target.matches('[data-name]')){state.players[Number(e.target.dataset.name)]=e.target.value;save()}if(e.target.id==='healChoice'){state.game.night.heal=e.target.checked;save()}});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();const f=new FormData(e.target);state.settings={mode:f.get('mode'),minutes:Number(f.get('minutes')),revealDeath:f.has('revealDeath'),voice:f.has('voice')};save();modal.close();if(page!=='game')render();toast('Đã lưu thiết lập cho ván mới.');});
document.getElementById('settingsBtn').addEventListener('click',settings);
document.getElementById('downloadBtn').addEventListener('click',()=>{if(location.protocol==='file:'||document.documentElement.dataset.standalone==='true'){const a=document.createElement('a');a.href=location.href;a.download='Ma-Soi-Dem-Lang-Offline.html';a.click();return}downloadOffline()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)veil()});
window.addEventListener('pagehide',()=>{secret=false;save()});
window.addEventListener('pageshow',e=>{if(e.persisted)veil()});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
if('serviceWorker'in navigator&&location.protocol==='https:'&&document.documentElement.dataset.standalone!=='true')navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{document.getElementById('offlineStatus').innerHTML='<b class="dot"></b> Đã lưu để chơi offline';}).catch(()=>{});
if(state.game?.stage==='day')timerLeft=state.game.settings.minutes*60;
render();
</script></body></html>
